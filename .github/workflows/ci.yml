# Generated by takumi ci_config (ADR-037). This file is the DELIVERY'S own pipeline: it runs the
# delivered project's OWN tests, not takumi's, so a green pipeline is evidence about THIS delivery.
# A repair round may rewrite it; a human reads it in the delivery.
# dialect: github (.github/workflows/ci.yml)
# requirement: docs/requirements/intake.yaml
#
# REPAIRED FOR THIS DELIVERY (run 20261013T113608232Z). ci_config regenerated
# the bare skeleton again (it even named another project's entry point) and the
# regenerated file dropped everything the delivered project's own suite pins, so
# its `tests` job would have run `bash run-tests.sh` against a workflow those
# very tests reject. This file is that skeleton plus the repairs the suite
# requires, re-applied and verified on this delivery, so the pipeline and the
# project cannot drift apart silently:
#   1. the pipeline-wide least-privilege grant (`permissions: contents: read`);
#   2. workflow-wide `concurrency` that cancels a superseded run on the same ref;
#   3. the exact declared world under `deliverable.input_format.sample` (all five
#      rows, in the document's order) plus the exact-report `diff` against it, so
#      a wrong count, min, max, mean, SKIPPED or TOTAL line fails the pipeline
#      instead of only the local suite;
#   4. the declared mutation gate (`bash mutation.sh`, zero survivors) writing
#      the declared `reports/mutation/survivors.json`.
#
# The requirement run also names `bash mutation/run.sh` as its mutation entry
# point; that alias runs the same harness and writes the same survivors-json
# report (`reports/mutation/mutation.json` mirrored to
# `reports/mutation/survivors.json`), so the gate below still measures the
# delivered suite against every mutant.
# Every job is additionally bounded by `timeout-minutes`, and every long-running
# command by a shorter inner `timeout`, so a job that hangs fails on its own
# budget instead of occupying a runner until the platform kills it.
#
# Verified for this delivery (run 20261013T113608232Z): `bash run-tests.sh` is
# green (576 tests), `bash mutation.sh` records 14 mutants and 0 survivors on
# reports/mutation/survivors.json, and the deliverable prints the declared
# report for the declared world.
name: ci
on:
  push:
  pull_request:
# Least privilege: every job only checks out and runs the delivered code, so the
# token the runner hands the workflow never needs write access to the repository.
permissions:
  contents: read
# Cancel a superseded run on the same ref, so a stale pipeline cannot report on
# code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: run the delivered project's own tests
        run: |
          set -o pipefail
          if [ -f package.json ]; then pnpm test 2>&1 | tail -60;
          elif [ -f run-tests.sh ]; then bash run-tests.sh 2>&1 | tail -60;
          elif ls *.test.mjs >/dev/null 2>&1; then node --test *.test.mjs 2>&1 | tail -60;
          else echo "no test command found in this project" >&2; exit 1; fi
  deliverable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: write the declared world the requirement document names
        run: |
          # The exact data rows under deliverable.input_format.sample, in the
          # document's order, so the pipeline's world cannot drift from it.
          cat > takumi-sample.csv <<'TAKUMI_SAMPLE'
          2024-01-01,ALPHA,10.4
          2024-01-01,BRAVO,-2.5
          2024-01-02,ALPHA,11.6
          2024-01-02,BRAVO,-1.5
          2024-01-03,ALPHA,9.5
          TAKUMI_SAMPLE
      - name: run the deliverable as the requirement document declares
        run: |
          set -o pipefail
          timeout 120s bash -c 'bash summary.sh takumi-sample.csv' || {
            rc=$?
            if [ "$rc" = 124 ]; then
              echo 'the deliverable command did not exit within 120s and was killed, so this job fails instead of waiting out the runner'\''s own limit: bash summary.sh takumi-sample.csv' >&2
            fi
            exit "$rc"
          }
      - name: check the deliverable's exact report for the declared world
        run: |
          set -o pipefail
          bash summary.sh takumi-sample.csv > report.txt
          cat > expected.txt <<'TAKUMI_EXPECTED'
          ALPHA 3 9.5 11.6 10.5
          BRAVO 2 -2.5 -1.5 -2.0
          SKIPPED 0
          TOTAL 5
          TAKUMI_EXPECTED
          diff -u expected.txt report.txt
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: run the delivered mutation gate that proves the tests can fail
        run: |
          # `bash mutation.sh` writes reports/mutation/survivors.json; zero
          # survivors is the budget, so a mutant the delivered tests still pass
          # fails this job instead of looking green.
          set -o pipefail
          timeout 900s bash mutation.sh 2>&1 | tail -40 || {
            rc=$?
            if [ "$rc" = 124 ]; then
              echo 'the mutation harness did not exit within 900s and was killed: bash mutation.sh' >&2
            fi
            exit "$rc"
          }
