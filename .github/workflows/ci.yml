# Generated by takumi ci_config (ADR-037). This file is the DELIVERY'S own pipeline: it runs the
# delivered project's OWN tests, not takumi's, so a green pipeline is evidence about THIS delivery.
# A repair round may rewrite it; a human reads it in the delivery.
# dialect: github (.github/workflows/ci.yml)
# requirement: docs/requirements/intake.yaml
#
# REPAIRED FOR THIS DELIVERY. ci_config regenerated the skeleton from a stale requirement family and
# left this file invoking another deliverable (`bash summary.sh`) on a CSV fixture, which this
# delivery does not produce. The confirmed document (docs/requirements/intake.yaml) asks for a JSON
# key-intersection CLI, so the jobs below run exactly its declared commands:
#   1. `tests`       -- bash run-tests.sh (SCN-001), then read the declared TAP report at
#                       reports/tests.tap and require TAP version 13, at least one passing point,
#                       `# fail 0` and no `not ok` line (REQ-005);
#   2. `deliverable` -- bash common-keys.sh <json> on the all-shared, partially-shared, none and
#                       skipped-element worlds, checking the declared answers byte for byte
#                       (REQ-001..REQ-004, AMB-001, AMB-002), plus a rejected non-array input
#                       (AMB-003); and
#   3. `mutation`    -- bash mutation.sh, then check reports/mutation/mutation.json is the declared
#                       survivors-json shape, measured at least one mutant and left no survivor
#                       (REQ-006, REL-001).
# Every job is bounded by timeout-minutes and every long command by a shorter inner timeout, so a
# job that hangs fails on its own budget instead of occupying a runner until the platform kills it.
name: ci
on:
  push:
  pull_request:
# Least privilege: every job only checks out and runs the delivered code.
permissions:
  contents: read
# Cancel a superseded run on the same ref, so a stale pipeline cannot report on replaced code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: run the delivered project's own tests
        run: |
          set -o pipefail
          timeout 600s bash run-tests.sh 2>&1 | tail -80 || {
            rc=$?
            if [ "$rc" = 124 ]; then
              echo 'the delivered test suite did not exit within 600s and was killed: bash run-tests.sh' >&2
            fi
            exit "$rc"
          }
      - name: check the declared TAP report
        run: |
          python3 - <<'TAKUMI_TAP'
          import re
          import sys

          path = "reports/tests.tap"
          try:
              with open(path, encoding="utf-8") as handle:
                  text = handle.read()
          except OSError as error:
              sys.exit("the declared TAP report %s could not be read: %s" % (path, error))
          if not text.startswith("TAP version 13"):
              sys.exit("the declared TAP report %s is not TAP version 13" % path)
          if re.search(r"^not ok", text, re.M):
              sys.exit("the declared TAP report %s records a failing assertion" % path)
          tests = re.search(r"^# tests (\d+)$", text, re.M)
          passes = re.search(r"^# pass (\d+)$", text, re.M)
          fails = re.search(r"^# fail (\d+)$", text, re.M)
          if not tests or not passes or int(passes.group(1)) <= 0:
              sys.exit("the declared TAP report %s records no passing assertion" % path)
          if not fails or int(fails.group(1)) != 0:
              sys.exit("the declared TAP report %s records a non-zero failure total" % path)
          if int(passes.group(1)) != int(tests.group(1)):
              sys.exit(
                  "the declared TAP report %s passes %s of %s tests"
                  % (path, passes.group(1), tests.group(1))
              )
          print("TAP report ok: %s assertion(s) passing, none failing" % passes.group(1))
          TAKUMI_TAP
  deliverable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: write the fixtures the deliverable is run on
        run: |
          cat > all-shared.json <<'COMMON_KEYS_ALL'
          [{"a": 1, "b": 2}, {"a": 3, "b": 4}]
          COMMON_KEYS_ALL
          cat > partial.json <<'COMMON_KEYS_PARTIAL'
          [{"a": 1, "b": 2}, {"a": 3, "c": 4}]
          COMMON_KEYS_PARTIAL
          cat > no-common.json <<'COMMON_KEYS_NONE'
          [{"x": 1}, {"y": 2}]
          COMMON_KEYS_NONE
          cat > empty.json <<'COMMON_KEYS_EMPTY'
          []
          COMMON_KEYS_EMPTY
          cat > skipped.json <<'COMMON_KEYS_SKIPPED'
          [{"a": 1, "b": 2}, 7, null, "text", {"a": 3, "c": 4}]
          COMMON_KEYS_SKIPPED
      - name: run the deliverable as the requirement document declares
        run: |
          set -o pipefail
          for input in all-shared.json partial.json no-common.json empty.json skipped.json; do
            timeout 30s bash common-keys.sh "$input" > "$input.out" 2> "$input.err" || {
              rc=$?
              if [ "$rc" = 124 ]; then
                echo "the deliverable did not exit within 30s and was killed: bash common-keys.sh $input" >&2
              fi
              exit "$rc"
            }
            test ! -s "$input.err" || {
              echo "a successful answer must write nothing to stderr: $input" >&2
              exit 1
            }
          done
      - name: check the declared answers
        run: |
          set -o pipefail
          printf 'a\nb\n' > all-shared.expected
          printf 'a\n' > partial.expected
          printf 'none\n' > no-common.expected
          printf 'none\n' > empty.expected
          printf 'a\n' > skipped.expected
          diff -u all-shared.expected all-shared.json.out
          diff -u partial.expected partial.json.out
          diff -u no-common.expected no-common.json.out
          diff -u empty.expected empty.json.out
          diff -u skipped.expected skipped.json.out
      - name: check that an unusable input is rejected
        run: |
          set -o pipefail
          printf '{"a": 1}\n' > not-array.json
          printf 'not json at all\n' > malformed.json
          if bash common-keys.sh not-array.json > not-array.out 2> not-array.err; then
            echo 'a top-level value that is not an array must exit non-zero (AMB-003)' >&2
            exit 1
          fi
          test -s not-array.err
          test ! -s not-array.out
          if bash common-keys.sh malformed.json > malformed.out 2> malformed.err; then
            echo 'an input that is not valid JSON must exit non-zero (AMB-003)' >&2
            exit 1
          fi
          test -s malformed.err
          test ! -s malformed.out
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: run the declared mutation command
        run: |
          set -o pipefail
          timeout 900s bash mutation.sh 2>&1 | tail -40 || {
            rc=$?
            if [ "$rc" = 124 ]; then
              echo 'the mutation command did not exit within 900s and was killed: bash mutation.sh' >&2
            fi
            exit "$rc"
          }
      - name: check the declared survivors-json report
        run: |
          python3 - <<'TAKUMI_CHECK'
          import json
          import sys

          path = "reports/mutation/mutation.json"
          try:
              with open(path, encoding="utf-8") as handle:
                  report = json.load(handle)
          except (OSError, ValueError) as error:
              sys.exit("the declared report %s could not be read: %s" % (path, error))
          if not isinstance(report, dict) or set(report) != {"total", "survivors"}:
              sys.exit("the report %s is not the declared survivors-json shape" % path)
          if not isinstance(report["total"], int) or report["total"] <= 0:
              sys.exit("the report measured %r mutant(s): a run that measured nothing is not a pass" % (report["total"],))
          if report["survivors"]:
              sys.exit("the report records %d survivor(s) where the budget is 0" % len(report["survivors"]))
          print("mutation report ok: %d mutant(s), 0 survivor(s)" % report["total"])
          TAKUMI_CHECK
