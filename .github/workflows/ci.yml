# Generated by takumi ci_config (ADR-037). This file is the DELIVERY'S own pipeline: it runs the
# delivered project's OWN tests, not takumi's, so a green pipeline is evidence about THIS delivery.
# A repair round may rewrite it; a human reads it in the delivery.
# dialect: github (.github/workflows/ci.yml)
# requirement: docs/requirements/intake.yaml
name: ci
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run the delivered project's own tests
        run: |
          set -o pipefail
          if [ -f package.json ]; then pnpm test 2>&1 | tail -60;
          elif [ -f run-tests.sh ]; then bash run-tests.sh 2>&1 | tail -60;
          elif ls *.test.mjs >/dev/null 2>&1; then node --test *.test.mjs 2>&1 | tail -60;
          else echo "no test command found in this project" >&2; exit 1; fi
  deliverable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write the sample input the requirement document declares
        run: |
          cat > takumi-sample.csv <<'TAKUMI_SAMPLE'
          2024-01-01,ALPHA,10.4
          2024-01-01,BRAVO,-2.5
          2024-01-02,ALPHA,11.6
          2024-01-02,BRAVO,-1.5
          2024-01-03,ALPHA,9.5
          TAKUMI_SAMPLE
      - name: run the deliverable as the requirement document declares
        run: |
          bash summary.sh takumi-sample.csv
