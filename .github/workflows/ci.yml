# Generated by takumi ci_config (ADR-037). This file is the DELIVERY'S own pipeline: it runs the
# delivered project's OWN tests, not takumi's, so a green pipeline is evidence about THIS delivery.
# A repair round may rewrite it; a human reads it in the delivery.
# dialect: github (.github/workflows/ci.yml)
# requirement: docs/requirements/intake.yaml
#
# The confirmed document declares this delivery as:
#   run:    bash common-keys.sh {json}
#   SCN-001 bash run-tests.sh            -> reports/tests.tap (TAP)
#   REL-001 bash mutation.sh             -> reports/mutation/mutation.json (survivors-json)
# Every job below runs exactly those commands.
#
# The input worlds are fixed by the recorded decisions: an empty array prints
# `none` (AMB-001), a non-object element is skipped (AMB-002), and unusable
# input is a non-zero stop-error with nothing on stdout (AMB-003).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: run the delivered project's own tests
        run: |
          set -o pipefail
          timeout 900s bash run-tests.sh 2>&1 | tail -100
      - name: check the declared TAP report
        run: |
          python3 - <<'TAKUMI_TAP'
          import re
          import sys

          path = "reports/tests.tap"
          with open(path, encoding="utf-8") as handle:
              text = handle.read()
          if not text.startswith("TAP version 13"):
              sys.exit("the declared TAP report %s is not TAP version 13" % path)
          if re.search(r"^not ok", text, re.M):
              sys.exit("the declared TAP report %s records a failing assertion" % path)
          tests = re.search(r"^# tests (\d+)$", text, re.M)
          passes = re.search(r"^# pass (\d+)$", text, re.M)
          fails = re.search(r"^# fail (\d+)$", text, re.M)
          if not tests or not passes or int(passes.group(1)) <= 0:
              sys.exit("the declared TAP report %s records no passing assertion" % path)
          if not fails or int(fails.group(1)) != 0:
              sys.exit("the declared TAP report %s records a non-zero failure total" % path)
          if int(passes.group(1)) != int(tests.group(1)):
              sys.exit("the declared TAP report %s passes %s of %s tests"
                       % (path, passes.group(1), tests.group(1)))
          TAKUMI_TAP
  deliverable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: run the deliverable on every declared world
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          printf '[{"a":1,"b":2},{"a":3,"c":4},{"a":5,"b":6}]' > "$tmp/partial.json"
          printf '[{"b":1,"a":2,"c":3}]' > "$tmp/order.json"
          printf '[{"x":1},{"y":2}]' > "$tmp/none.json"
          printf '[]' > "$tmp/empty.json"
          printf '[{"a":1},7,"x",null,[1],{"a":2}]' > "$tmp/skip.json"
          printf '{"a":1}' > "$tmp/not-array.json"

          check() {
            local file="$1" expected="$2" actual
            actual="$(bash common-keys.sh "$file")"
            if [ "$actual" != "$expected" ]; then
              printf 'common-keys.sh %s printed %q, expected %q\n' "$file" "$actual" "$expected" >&2
              exit 1
            fi
          }

          check "$tmp/partial.json" 'a'
          check "$tmp/order.json"   $'a\nb\nc'
          check "$tmp/none.json"    'none'
          check "$tmp/empty.json"   'none'
          check "$tmp/skip.json"    'a'

          if bash common-keys.sh "$tmp/not-array.json" > "$tmp/out"; then
            echo 'a top-level value that is not an array must be rejected' >&2
            exit 1
          fi
          test ! -s "$tmp/out"
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: run the declared mutation harness
        run: |
          set -o pipefail
          timeout 900s bash mutation.sh 2>&1 | tail -80
      - name: check the declared mutation report
        run: |
          python3 - <<'TAKUMI_MUTATION'
          import json
          import sys

          path = "reports/mutation/mutation.json"
          with open(path, encoding="utf-8") as handle:
              report = json.load(handle)
          total = report.get("total")
          survivors = report.get("survivors")
          if not isinstance(total, int) or total < 1:
              sys.exit("the mutation report %s must record at least one mutant" % path)
          if not isinstance(survivors, list) or survivors:
              sys.exit("the mutation report %s records surviving mutants: %r" % (path, survivors))
          TAKUMI_MUTATION
