# Generated by takumi ci_config (ADR-037). This file is the DELIVERY'S own pipeline: it runs the
# delivered project's OWN tests, not takumi's, so a green pipeline is evidence about THIS delivery.
# A repair round may rewrite it; a human reads it in the delivery.
# dialect: github (.github/workflows/ci.yml)
# requirement: docs/requirements/intake.yaml
name: ci
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run the delivered project's own tests
        run: |
          set -o pipefail
          if [ -f package.json ]; then pnpm test 2>&1 | tail -60;
          elif [ -f run-tests.sh ]; then bash run-tests.sh 2>&1 | tail -60;
          elif ls *.test.mjs >/dev/null 2>&1; then node --test *.test.mjs 2>&1 | tail -60;
          else echo "no test command found in this project" >&2; exit 1; fi
  deliverable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run the deliverable as the requirement document declares
        run: |
          set -o pipefail
          printf 'region,amount\nnorth,120.50\nsouth,80.00\nnorth,99.50\neast,45.25\n' > sample.csv
          timeout 120s bash -c 'bash summary.sh sample.csv' || {
            rc=$?
            if [ "$rc" = 124 ]; then
              echo 'the deliverable command did not exit within 120s and was killed, so this job fails instead of waiting out the runner'\''s own limit: bash summary.sh sample.csv' >&2
            fi
            exit "$rc"
          }
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mutation detection (the command the delivery review runs)
        run: |
          set -o pipefail
          npx stryker run --reporters json > mutation-report.json
          python3 - <<'PY'
          import json

          report = json.load(open("mutation-report.json", encoding="utf-8"))
          statuses = [m["status"] for f in report["files"].values() for m in f["mutants"]]
          print("%d mutants: %d killed, %d survived"
                % (len(statuses), statuses.count("Killed"), statuses.count("Survived")))
          if "Survived" in statuses:
              raise SystemExit("the delivered tests did not notice every mutation")
          PY
