# Generated by takumi ci_config (ADR-037). This file is the DELIVERY'S own pipeline: it runs the
# delivered project's OWN tests, not takumi's, so a green pipeline is evidence about THIS delivery.
# A repair round may rewrite it; a human reads it in the delivery.
# dialect: github (.github/workflows/ci.yml)
# requirement: docs/requirements/intake.yaml
#
# REPAIRED FOR THIS DELIVERY (run 20261013T135637681Z, attempt 1). ci_config regenerated the bare
# skeleton and it again named another project's world: the deliverable step ran
# `bash common-keys.sh {json}` (a literal placeholder no shell can execute) and the test step
# preferred a package-manager command over the entry point the confirmed document declares. This
# file is that skeleton plus the repairs docs/requirements/intake.yaml actually needs:
#   1. a pipeline-wide least-privilege grant (`permissions: contents: read`);
#   2. workflow-wide `concurrency` that cancels a superseded run on the same ref;
#   3. a `tests` job that runs the delivered suite (`bash run-tests.sh`, the declared SCN-001
#      command), then reads the declared TAP report at reports/tests.tap, requires `TAP version 13`,
#      at least one `ok` line, a positive `# pass` total, a `# fail 0` total and no `not ok` line
#      (REQ-004 / SCN-001);
#   4. a `deliverable` job that runs exactly the declared command (`bash pathfind.sh {map}`) on a
#      reachable map, a map whose only route must detour around walls, and an unreachable map, and
#      diffs the declared answers (REQ-003), then checks that a malformed map is rejected with a
#      diagnostic on stderr and nothing on stdout (AMB-003); and
#   5. a `mutation` job that runs the declared mutation command
#      (`npx stryker run --reporters json`) and checks the declared survivors-json report
#      (reports/mutation/mutation.json) measured at least one mutant and left no survivor (REQ-005).
# Every job is additionally bounded by `timeout-minutes`, and every long-running command by a shorter
# inner `timeout`, so a job that hangs fails on its own budget instead of occupying a runner until
# the platform kills it.
name: ci
on:
  push:
  pull_request:
# Least privilege: every job only checks out and runs the delivered code, so the token the runner
# hands the workflow never needs write access to the repository.
permissions:
  contents: read
# Cancel a superseded run on the same ref, so a stale pipeline cannot report on code that has already
# been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: run the delivered project's own tests
        run: |
          set -o pipefail
          timeout 600s bash run-tests.sh 2>&1 | tail -60 || {
            rc=$?
            if [ "$rc" = 124 ]; then
              echo 'the delivered test suite did not exit within 600s and was killed: bash run-tests.sh' >&2
            fi
            exit "$rc"
          }
      - name: check the declared TAP report
        run: |
          set -o pipefail
          echo 'the run-tests.sh step above is the declared SCN-001 command; this step reads its report'
          python3 - <<'TAKUMI_TAP'
          import re
          import sys
          path = "reports/tests.tap"
          try:
              with open(path, encoding="utf-8") as handle:
                  text = handle.read()
          except OSError as error:
              sys.exit("the declared TAP report %s could not be read: %s" % (path, error))
          if not text.startswith("TAP version 13"):
              sys.exit("the declared TAP report %s is not TAP version 13" % path)
          if re.search(r"^not ok", text, re.M):
              sys.exit("the declared TAP report %s records a failing assertion" % path)
          passes = re.search(r"^# pass (\d+)$", text, re.M)
          tests = re.search(r"^# tests (\d+)$", text, re.M)
          fails = re.search(r"^# fail (\d+)$", text, re.M)
          if not tests or not passes or int(passes.group(1)) <= 0:
              sys.exit("the declared TAP report %s records no passing assertion" % path)
          if not fails or int(fails.group(1)) != 0:
              sys.exit("the declared TAP report %s records a non-zero failure total" % path)
          if int(passes.group(1)) != int(tests.group(1)):
              sys.exit(
                  "the declared TAP report %s passes %s of %s tests"
                  % (path, passes.group(1), tests.group(1))
              )
          print("TAP report ok: %s assertion(s) passing, none failing" % passes.group(1))
          TAKUMI_TAP
  deliverable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: write the maps the deliverable is run on
        run: |
          cat > reachable-map.txt <<'TAKUMI_REACHABLE'
          S....
          .....
          .....
          .....
          ....E
          TAKUMI_REACHABLE
          cat > wall-map.txt <<'TAKUMI_WALL'
          S.#
          ..#
          #.E
          TAKUMI_WALL
          cat > unreachable-map.txt <<'TAKUMI_UNREACHABLE'
          S#
          ##
          #E
          TAKUMI_UNREACHABLE
      - name: run the deliverable as the requirement document declares
        run: |
          set -o pipefail
          for map in reachable-map.txt wall-map.txt unreachable-map.txt; do
            timeout 30s bash pathfind.sh "$map" > "$map.answer" || {
              rc=$?
              if [ "$rc" = 124 ]; then
                echo "the deliverable command did not exit within 30s and was killed: bash pathfind.sh $map" >&2
              fi
              exit "$rc"
            }
          done
      - name: check the declared answers
        run: |
          set -o pipefail
          printf '8\n' > expected-reachable.txt
          printf '4\n' > expected-wall.txt
          printf 'unreachable\n' > expected-unreachable.txt
          diff -u expected-reachable.txt reachable-map.txt.answer
          diff -u expected-wall.txt wall-map.txt.answer
          diff -u expected-unreachable.txt unreachable-map.txt.answer
      - name: check that a malformed map is rejected
        run: |
          set -o pipefail
          printf 'S.\n.E.\n' > malformed-map.txt
          if bash pathfind.sh malformed-map.txt > malformed-out.txt 2> malformed-err.txt; then
            echo 'a malformed map must exit non-zero (AMB-003: reject)' >&2
            exit 1
          fi
          test -s malformed-err.txt
          test ! -s malformed-out.txt
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: run the declared mutation command
        run: |
          set -o pipefail
          timeout 900s npx stryker run --reporters json 2>&1 | tail -40 || {
            rc=$?
            if [ "$rc" = 124 ]; then
              echo 'the mutation command did not exit within 900s and was killed: npx stryker run --reporters json' >&2
            fi
            exit "$rc"
          }
      - name: check the declared survivors-json report
        run: |
          python3 - <<'TAKUMI_CHECK'
          import json
          import sys
          path = "reports/mutation/mutation.json"
          try:
              with open(path, encoding="utf-8") as handle:
                  report = json.load(handle)
          except (OSError, ValueError) as error:
              sys.exit("the declared report %s could not be read: %s" % (path, error))
          if not isinstance(report, dict) or "total" not in report or "survivors" not in report:
              sys.exit("the report %s is not the declared survivors-json shape" % path)
          if not isinstance(report["total"], int) or report["total"] <= 0:
              sys.exit("the report measured %r mutant(s): a run that measured nothing is not a pass" % (report["total"],))
          if report["survivors"]:
              sys.exit("the report records %d survivor(s) where the budget is 0" % len(report["survivors"]))
          print("mutation report ok: %d mutant(s), 0 survivor(s)" % report["total"])
          TAKUMI_CHECK
