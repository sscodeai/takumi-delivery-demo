requirements:
  - id: REQ-001
    title: "Provide the summary.sh entry point"
    description: "The repository must ship `summary.sh` at its root. It is invoked as `bash summary.sh <csv>` and takes the path of the ticket CSV as its first argument. It must use only tooling already available locally, need no network access, and leave the input file untouched."
    acceptance_criteria:
      - "`bash summary.sh <csv>` accepts an existing CSV path as `$1` and exits 0 on well-formed input."
      - "No argument other than the CSV path is required, and the input file is not modified."
      - "A typical file of 100,000 ticket rows is summarised in under 10 seconds; this is a prose goal and no judge checks it."
    priority: High
    source: "I want a command-line tool that reads a CSV of support tickets"
  - id: REQ-002
    title: "Parse the ticket CSV and count per assignee and status"
    description: "The first line of the CSV is the header `assignee,status` and is never counted as a ticket. Every remaining row contributes exactly one ticket to the cell identified by its assignee and its status. Open and closed are the two statuses the report distinguishes; how a status value is matched to them is left to AMB-003, and how an unusable row is treated is left to AMB-004. Printed counts are non-negative integers."
    acceptance_criteria:
      - "The header line is recognised and excluded from all counts."
      - "Each data row increments exactly one assignee/status cell, so no accepted ticket is counted twice or dropped."
      - "The two reported categories are open tickets and closed tickets."
    priority: High
    source: "The CSV has a header row with columns: assignee, status."
  - id: REQ-003
    title: "Report both open and closed counts for each assignee"
    description: "For every distinct assignee present in the CSV, the output reports how many of that assignee's tickets are open and how many are closed. An assignee whose tickets are all in one status is still reported, with the other number shown as zero (pending AMB-005 for the exact presentation). The layout of these lines is settled by AMB-001; no judge checks that layout yet."
    acceptance_criteria:
      - "Every distinct assignee in the input appears exactly once in the report."
      - "An assignee with tickets in both statuses shows both its open count and its closed count."
      - "An assignee with tickets in only one status is still reported."
      - "The sum of the per-assignee open counts and the sum of the per-assignee closed counts together equal the number of accepted ticket rows."
    priority: High
    source: "prints how many tickets each assignee has open and closed"
  - id: REQ-004
    title: "Print a file-wide totals line"
    description: "After the per-assignee report the tool prints one totals line for the whole file, giving the total number of open tickets and the total number of closed tickets. Those totals must equal the sums of the per-assignee counts, and their sum must equal the number of accepted ticket rows."
    acceptance_criteria:
      - "Exactly one totals line is printed."
      - "The totals line reports the open total and the closed total for the whole file."
      - "Each total equals the sum of the corresponding per-assignee counts."
      - "The open total plus the closed total equals the number of accepted ticket rows."
    priority: High
    source: "prints how many tickets each assignee has open and closed"
  - id: REQ-005
    title: "Ship the test suite that decides the output"
    description: "The repository must ship `run-tests.sh` at its root as the delivered test entry point. Running `bash run-tests.sh` exercises `summary.sh` against checked-in CSV fixtures and writes a TAP report to `reports/tests.tap`. The tests must assert the per-assignee open/closed counts, the zero-count case, header handling, and the totals line, and must report `not ok` when the observed counts are wrong."
    acceptance_criteria:
      - "`bash run-tests.sh` exits 0 when the implementation is correct and writes a readable TAP report to `reports/tests.tap`."
      - "The report contains at least one `ok` line per asserted behaviour and no `not ok` line for a correct implementation."
      - "The tests assert per-assignee open and closed counts on at least two distinct assignees, the zero-count case, and the totals line."
      - "A summary.sh that miscounts, swaps open and closed, or omits the totals line makes at least one test report `not ok`."
    priority: High
    source: "I want a command-line tool that reads a CSV of support tickets and prints how many tickets each assignee has open and closed."
  - id: REQ-006
    title: "Ship the mutation check for the delivered tests"
    description: "The repository must ship `tests/mutation.sh`, runnable as `bash tests/mutation.sh`. It mutates the counting behaviour in `summary.sh` (for example by swapping the open and closed buckets, or by dropping the totals line) and re-runs the delivered tests against each mutant. It writes a tool-agnostic survivors report to `reports/mutation/mutation.json` in the form `{\"total\": <int>, \"survivors\": [{\"file\": \"...\", \"line\": <int>, \"description\": \"...\"}, ...]}`."
    acceptance_criteria:
      - "`bash tests/mutation.sh` writes a readable report to `reports/mutation/mutation.json`."
      - "The report states a total number of mutants greater than zero."
      - "The delivered test suite fails on every injected mutant, so the survivors list is empty."
    priority: Medium
    source: "Derived from the delivery contract: the delivered tests must be able to fail."
  - id: REQ-007
    title: "Document the deferred decisions without choosing them"
    description: "The delivered README must list the open decisions AMB-001 through AMB-005 and state plainly that they are pending human sign-off and that no judge checks them yet. The implementation must not hide a choice: if a default is implemented while a question is open, the README says which default was taken."
    acceptance_criteria:
      - "The README names every ambiguity in this document and its current status."
      - "The README states that the pending presentation and tolerance decisions are not mechanised by a judge."
      - "No acceptance criterion of REQ-001 through REQ-006 claims a check that the judge does not run."
    priority: Medium
    source: "Requirement intake rule: do not silently choose an interpretation and drop the question."
ambiguities:
  - id: AMB-001
    question: "How is each assignee's open and closed result laid out on screen?"
    options:
      - "one-line: one line per assignee carrying both the open count and the closed count"
      - "per-status: two lines per assignee, one for its open count and one for its closed count"
      - "sections: an OPEN section and a CLOSED section, each listing every assignee"
    default: "one-line: one line per assignee carrying both the open count and the closed count"
    blocking: false
    chosen: "one-line: one line per assignee carrying both the open count and the closed count"
  - id: AMB-002
    question: "In what order do the per-assignee results appear?"
    options:
      - "alphabetical: assignees sorted by name, locale-independent byte order"
      - "first-seen: assignees in the order their first ticket appears in the CSV"
    default: "alphabetical: assignees sorted by name, locale-independent byte order"
    blocking: false
    chosen: "alphabetical: assignees sorted by name, locale-independent byte order"
  - id: AMB-003
    question: "Which status values count as open and which as closed?"
    options:
      - "exact: only the lowercase tokens `open` and `closed` are recognised"
      - "case-insensitive: `Open`, `OPEN` and surrounding whitespace are accepted and normalised"
      - "binary: `closed` (any case) is closed and every other non-empty value is open"
    default: "exact: only the lowercase tokens `open` and `closed` are recognised"
    blocking: false
    chosen: "exact: only the lowercase tokens `open` and `closed` are recognised"
  - id: AMB-004
    question: "What happens to a data row with an empty assignee or an unrecognised status?"
    options:
      - "skip: the row is ignored and the run continues, without affecting either count"
      - "skip-and-report: the row is ignored and a count of skipped rows is printed alongside the totals"
      - "stop: the tool prints an error naming the row and exits non-zero"
    default: "skip: the row is ignored and the run continues, without affecting either count"
    blocking: false
    chosen: "skip: the row is ignored and the run continues, without affecting either count"
  - id: AMB-005
    question: "How is an assignee shown whose tickets are all in one status?"
    options:
      - "explicit-zero: the missing category is printed as 0"
      - "omit-zero: the missing category is left out of that assignee's line"
    default: "explicit-zero: the missing category is printed as 0"
    blocking: false
    chosen: "explicit-zero: the missing category is printed as 0"
deliverable:
  run: "bash summary.sh {csv}"
  timeoutMs: 10000
  scenarios:
    - id: SCN-001
      run: "bash run-tests.sh"
      expect: "the delivered suite passes: its TAP report shows per-assignee open and closed counts, the zero-count case and the file-wide totals with no failing test"
      report: tap
      report_path: "reports/tests.tap"
      description: "Run the delivered test suite against checked-in CSV fixtures and read its TAP report."
  relations:
    - id: REL-001
      relation: mutation-detection
      description: "The delivered tests fail when the delivered counting behaviour is mutated."
  mutation:
    run: "bash tests/mutation.sh"
    report_path: "reports/mutation/mutation.json"
    format: survivors-json
    max_survivors: 0
