# Requirement intake. Built in steps: skeleton first, then requirements,
# then ambiguities, then the deliverable contract.
requirements:
  - id: REQ-001
    title: "Ship summary.sh as the single entry point"
    description: "The repository must provide a shell script named summary.sh at the
      repository root. A judge invokes it as `bash summary.sh <csv>`, where <csv> is
      the path of a CSV file of test run records. The script takes that path from $1,
      reads it, writes the report to stdout and exits 0 for well-formed input."
    acceptance_criteria:
      - "summary.sh exists at the repository root and `bash summary.sh <path>` runs with no install or build step."
      - "On a well-formed CSV the command exits 0 and writes the report to stdout."
    priority: High
    source: "Request: 'a command-line tool that reads a CSV of test run records and prints one line per suite'."

  - id: REQ-002
    title: "Read the header row and locate the three columns by name"
    description: "The first row of the CSV is a header naming the columns suite, passed
      and total. The script must skip that header row and locate the three columns by
      their header names, so a file whose columns are in a different order still
      yields the same report."
    acceptance_criteria:
      - "A header row is never treated as a data row and never produces a suite line."
      - "The same records written as `suite,passed,total` and as `total,suite,passed` produce the same report."
    priority: High
    source: "Request: 'The CSV has a header row with columns: suite, passed, total.'"

  - id: REQ-003
    title: "Print exactly one line per distinct suite"
    description: "The report carries exactly one suite line for each distinct value of the
      suite column, in order of first appearance in the input, and no other per-suite
      text. A suite that spans several input rows is reported once (see AMB-002)."
    acceptance_criteria:
      - "A fixture with three distinct suites yields exactly three suite lines."
      - "A fixture whose single suite repeats over several rows yields exactly one suite line for it."
      - "Suite values are echoed verbatim, without case folding or trimming."
    priority: High
    source: "Request: 'prints one line per suite'."

  - id: REQ-004
    title: "Print the pass percentage with one decimal place"
    description: "Each suite line reports the pass percentage as passed / total * 100
      expressed in percentage points (0 to 100), rounded to one decimal place and
      always printed with exactly one digit after the decimal point, e.g. 96.0 and
      33.3. Rounding of exact halves follows AMB-001."
    acceptance_criteria:
      - "passed=48, total=50 prints 96.0; passed=12, total=12 prints 100.0; passed=1, total=3 prints 33.3."
      - "The percentage token always carries exactly one digit after the decimal point."
      - "The percentage is in percentage points, not a 0-1 fraction."
    priority: High
    source: "Request: 'the pass percentage rounded to one decimal place'."

  - id: REQ-005
    title: "Print one totals line for the whole file"
    description: "After the suite lines the report carries exactly one totals line of the
      form `TOTAL <tests>`, where <tests> is the sum of the total column over every
      counted suite (the summed denominator of the printed suite lines)."
    acceptance_criteria:
      - "The report contains exactly one line whose first token is TOTAL."
      - "The TOTAL value equals the sum of the denominator values printed on the suite lines."
    priority: High
    source: "Derived from 'one line per suite' plus the whole-file reading a judge compares against."

  - id: REQ-006
    title: "Resolve repeated suites and unusable rows as the recorded decisions say"
    description: "Repeated suite keys are resolved the way AMB-002 decides (default:
      merge every occurrence into one line by summing passed and total), and rows that
      cannot yield a percentage are handled the way AMB-003 decides (default: skipped
      silently, the run still exits 0). Neither of these two behaviours is mechanised
      by a judge relation yet: they are reported as not mechanised."
    acceptance_criteria:
      - "Two rows for the same suite under the merge reading produce one line whose denominator is the sum of the two totals."
      - "A row with a non-numeric passed or total, or total of 0, does not abort the run under the default and is not reported as a suite."
    priority: Medium
    source: "Open decisions raised by the request; see AMB-002 and AMB-003."
ambiguities:
  - id: AMB-001
    question: "How are percentages rounded when the exact value falls on a half at the one-decimal boundary?"
    options:
      - "half-up: round half away from zero (6.25 becomes 6.3)"
      - "truncate: drop the remainder (6.25 becomes 6.2)"
    default: "half-up: round half away from zero (6.25 becomes 6.3)"
    checkedAs: half-up
    blocking: true

    chosen: "half-up: round half away from zero (6.25 becomes 6.3)"
  - id: AMB-002
    question: "When the suite key repeats across several rows, what does one line per suite mean?"
    options:
      - "merge: every occurrence counts, summing passed and total into one line"
      - "last-row: only the last occurrence of the suite is kept"
      - "error: a repeated suite aborts the run with a non-zero exit"
    default: "merge: every occurrence counts, summing passed and total into one line"
    blocking: false

    chosen: "merge: every occurrence counts, summing passed and total into one line"
  - id: AMB-003
    question: "What happens to a row that cannot yield a percentage (non-numeric passed or total, or total of 0)?"
    options:
      - "skip-silent: skip the row, print nothing about it, still exit 0"
      - "skip-count: skip the row, still exit 0, and print a SKIPPED line counting it"
      - "stop-error: abort the run with a non-zero exit and a message on stderr"
    default: "skip-silent: skip the row, print nothing about it, still exit 0"
    blocking: false

    chosen: "skip-silent: skip the row, print nothing about it, still exit 0"
deliverable:
  run: "bash summary.sh {csv}"
  timeoutMs: 30000
  input_format:
    columns: "suite:id,passed:measure,total:other"
    sample: |
      auth-service,48,50
      billing,12,12
      search,7,9
      auth-service,2,4
  output_format:
    suite_line:
      shape: "<suite> <passed> <total> <percentage>"
      fields: [id, numerator, denominator, ratio]
    total_line:
      shape: "TOTAL <tests>"
      fields: [sum]
  relations:
    - id: REL-001
      relation: derived-ratio
      decides: AMB-001
      description: "Each printed percentage equals the line's own passed divided by its own
        total times 100, rounded to one decimal the way AMB-001 decided."

