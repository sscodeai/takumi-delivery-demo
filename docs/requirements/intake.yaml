requirements:
  - id: REQ-001
    title: "Provide the command-line entry point"
    description: "The deliverable must provide an executable script named pathfind.sh at the repository root. It takes the grid-map file path as its first argument ($1) and, on success, writes exactly one answer line to stdout: either a non-negative integer path length or the lowercase word unreachable. It exits 0 when it produced an answer and non-zero on a rejected input."
    acceptance_criteria:
      - "bash pathfind.sh <map-file> reads the given file and writes exactly one line to stdout."
      - "The success output is either an integer greater than or equal to 0 or the single lowercase token unreachable, with no other text on stdout."
      - "The command exits 0 when it printed an answer and non-zero when it rejected the input."
    priority: High
    source: "a small command-line tool that reads a grid map from a text file ... prints the length ... or 'unreachable'"
  - id: REQ-002
    title: "Parse the grid-map text format"
    description: "The tool must read a rectangular grid of characters where '#' is a wall, '.' is a free cell, 'S' is the start and 'E' is the exit. S and E cells are traversable. The map contains exactly one S and exactly one E. A map that violates these rules must be rejected with a non-zero exit and a diagnostic on stderr."
    acceptance_criteria:
      - "A map containing '#' and '.' cells with one 'S' and one 'E' is accepted and produces an answer."
      - "The S cell and the E cell are treated as walkable cells for pathing purposes."
      - "A map with no S, no E, more than one S, or more than one E causes a non-zero exit and a message on stderr."
      - "Leading and trailing whitespace on each line, blank lines, and CRLF line endings do not change the parsed grid."
    priority: High
    source: "a grid map from a text file (walls '#', free cells '.', one start 'S' and one exit 'E')"
  - id: REQ-003
    title: "Print the shortest path length or unreachable"
    description: "The tool must print the length of the shortest path from S to E measured in steps, where the allowed moves and the definition of a step are the ones recorded by the decisions AMB-001 and AMB-002 in this document. When no path connects S and E under the recorded movement rules, it must print the single lowercase token unreachable instead of a number."
    acceptance_criteria:
      - "For a map where a path exists, the printed number equals the shortest number of steps between S and E under the movement rules of AMB-001 and the step definition of AMB-002."
      - "For a map where the exit is fully walled off from the start, the tool prints unreachable and exits 0."
      - "A map whose shortest path length is 0 (start coincides with exit, if the format permits it) or any other non-negative integer is printed as a plain decimal integer."
      - "No judge in this chain yet mechanises the choice between the movement options of AMB-001 or the step definitions of AMB-002; the delivered tests are the only automated check of that behaviour."
    priority: High
    source: "prints the length of the shortest path from S to E in steps, or 'unreachable'"
  - id: REQ-004
    title: "Ship an automated test suite with a TAP report"
    description: "The deliverable must provide a test entry point run-tests.sh at the repository root that runs the project's own tests, exits 0 only when every test passes, and writes a TAP report to reports/tests.tap. The tests must assert the shortest path length for reachable maps, the unreachable case, and at least one wall-obstacle case."
    acceptance_criteria:
      - "bash run-tests.sh completes and writes a TAP report at reports/tests.tap."
      - "The TAP report contains at least one passing assertion and no failing assertion for the delivered implementation."
      - "The suite includes an assertion on a shortest path length that requires routing around walls, not merely a straight-line distance."
      - "The suite includes an assertion that a map with no route prints unreachable."
    priority: High
    source: "implicit quality requirement: the answer must be checked by the tests the deliverable ships"
  - id: REQ-005
    title: "Make the declared mutation tool runnable in the worktree"
    description: "The project must be set up so that the command declared in deliverable.mutation.run runs inside the delivery worktree without further setup and writes a survivors-json report to the declared mutation report path, reporting every surviving mutant of the delivered test suite. The implementation language and toolchain must be chosen so this declared command applies."
    acceptance_criteria:
      - "Running the declared mutation command in the worktree produces a readable report at reports/mutation/mutation.json."
      - "The report conforms to the survivors-json shape with a total mutant count greater than zero and a survivors list."
      - "The delivered test suite kills every mutant of the core pathfinding and map-parsing behaviour, so the survivors list is empty."
    priority: Medium
    source: "the request asks for a tool whose behaviour should be pinned down by its own tests, not only by a one-off run"
ambiguities:
  - id: AMB-001
    question: "Which moves are allowed between adjacent cells of the grid?"
    options:
      - "orthogonal: only the four edge-adjacent moves (up, down, left, right), each costing one step"
      - "diagonal: the four edge-adjacent moves plus the four diagonal moves, each costing one step"
    default: "orthogonal: only the four edge-adjacent moves (up, down, left, right), each costing one step"
    blocking: false
    chosen: "orthogonal: only the four edge-adjacent moves (up, down, left, right), each costing one step"
  - id: AMB-002
    question: "What does one step of the printed path length count?"
    options:
      - "edges: the number of moves made, so a start adjacent to the exit has length 1"
      - "cells: the number of cells on the path including the start, so a start adjacent to the exit has length 2"
    default: "edges: the number of moves made, so a start adjacent to the exit has length 1"
    blocking: false
    chosen: "edges: the number of moves made, so a start adjacent to the exit has length 1"
  - id: AMB-003
    question: "How should a map that breaks the declared format be handled?"
    options:
      - "reject: exit non-zero and print a diagnostic on stderr for a missing or duplicated S or E, ragged rows, or unknown characters"
      - "best-effort: treat unknown characters as walls and pad ragged rows, and answer whenever exactly one S and one E are present"
    default: "reject: exit non-zero and print a diagnostic on stderr for a missing or duplicated S or E, ragged rows, or unknown characters"
    blocking: false
    chosen: "reject: exit non-zero and print a diagnostic on stderr for a missing or duplicated S or E, ragged rows, or unknown characters"
deliverable:
  run: "bash pathfind.sh {map}"
  timeoutMs: 10000
  scenarios:
    - id: SCN-001
      run: "bash run-tests.sh"
      expect: "the delivered test suite passes and its report asserts shortest path lengths for reachable maps and the unreachable case"
      report: tap
      report_path: "reports/tests.tap"
      description: "Run the delivered test suite and read its TAP report; a failing or unreadable report fails the scenario."
  relations:
    - id: REL-001
      relation: mutation-detection
      description: "The delivered tests fail when the delivered pathfinding or map-parsing behaviour is mutated."
  mutation:
    run: "npx stryker run --reporters json"
    report_path: "reports/mutation/mutation.json"
    format: survivors-json
    max_survivors: 0
    timeoutMs: 900000
