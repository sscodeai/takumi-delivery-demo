requirements:
  - id: REQ-001
    title: "Provide summary.sh as the command-line entry point"
    description: >-
      The repository root must contain a script named `summary.sh` that is
      invoked as `bash summary.sh <csv>`: its first positional argument is the
      path to the CSV file. It reads that file and writes the report to
      standard output. A successful run exits 0; a missing argument, missing
      file or unreadable file exits non-zero and writes a diagnostic to
      standard error. It must not require a server, network access or
      interactive input.
    acceptance_criteria:
      - "`bash summary.sh <path-to-valid.csv>` exits 0 and writes the report to standard output."
      - "`bash summary.sh` with no argument exits non-zero and writes a diagnostic to standard error."
      - "`bash summary.sh /nonexistent/file.csv` exits non-zero and writes a diagnostic to standard error."
    priority: High
    source: "The request asks for 'a command-line tool that reads a CSV'."

  - id: REQ-002
    title: "Consume the declared CSV header and records"
    description: >-
      The input is comma-separated text whose first line is the header
      `suite,passed,total`. Each subsequent non-empty line is one record:
      `suite` is the suite name, `passed` is the number of passing tests and
      `total` is the number of tests. The header is consumed and never printed
      as a suite. A file with only the header is valid and produces no suite
      lines. Fields are separated by commas; surrounding whitespace on each
      field is ignored.
    acceptance_criteria:
      - "A file containing only the header produces no suite lines."
      - "The header text is never emitted as a suite line."
      - "A file with the header and three valid records produces exactly three suite lines."
    priority: High
    source: "The request states the CSV has a header row with columns suite, passed, total."

  - id: REQ-003
    title: "Compute each suite's pass percentage"
    description: >-
      For each suite, the pass percentage is `passed / total * 100`. The value
      is printed with exactly one digit after the decimal point. Rounding
      follows AMB-001; under the proposed default it is round-half-up (away
      from zero) rather than truncation.
    acceptance_criteria:
      - "Under the proposed half-up default, a suite with passed=45 and total=50 prints `90.0`."
      - "Under the proposed half-up default, a suite with passed=2 and total=3 prints `66.7` (not `66.6`)."
      - "Every printed percentage contains exactly one digit after the decimal point."
    priority: High
    source: "The request says 'prints one line per suite with the pass percentage rounded to one decimal place'."

  - id: REQ-004
    title: "Print the suite lines and one totals line in the declared shape"
    description: >-
      The report contains exactly one line per distinct suite, in the order in
      which each suite first appears in the input, followed by exactly one
      totals line. A suite line is `<suite> <passed> <total> <percentage>` with
      single ASCII spaces, no percent sign and no header. The totals line is
      `TOTAL <passed_sum> <total_sum>`, where `<passed_sum>` is the sum of the
      `passed` values on the printed suite lines and `<total_sum>` is the sum
      of the `total` values on those lines. A header-only input prints only
      `TOTAL 0 0`.
    acceptance_criteria:
      - "A fixture with the three sample rows prints three suite lines in first-appearance order followed by one `TOTAL` line."
      - "The final line matches `TOTAL <integer> <integer>`."
      - "The first number on the `TOTAL` line equals the sum of the numerator values on the suite lines, and the second equals the sum of the denominator values."
      - "No line contains a percent sign or a header label."
    priority: High
    source: "The request requires one line per suite; the totals line makes the report checkable as a whole."

  - id: REQ-005
    title: "Record the non-mechanised edge-case policies"
    description: >-
      The request does not settle repeated suite names, zero totals or
      malformed rows. They are recorded as AMB-002, AMB-003 and AMB-004. No
      declared judge relation checks these three policies; the implementation
      and its documentation must follow the answered option, or the proposed
      default while the question is unanswered. These policies are not claimed
      as mechanised acceptance criteria.
    acceptance_criteria:
      - "AMB-002, AMB-003 and AMB-004 each have exactly one documented policy in the delivered project's README or help text."
      - "No relation in this document claims to check the duplicate-suite, zero-total or malformed-row policy."
    priority: Medium
    source: "The request is silent on duplicates, zero denominators and malformed rows."

ambiguities:
  - id: AMB-001
    question: "How must the pass percentage be rounded when passed/total*100 has more than one decimal place?"
    options:
      - "half-up: round half away from zero to one decimal place"
      - "truncate: drop all digits after the first decimal place"
    default: "half-up: round half away from zero to one decimal place"
    checkedAs: half-up
    blocking: true

    chosen: "half-up: round half away from zero to one decimal place"
  - id: AMB-002
    question: "When the same suite name appears on more than one data row, how is that suite reported?"
    options:
      - "merge: sum passed and total across all rows for the suite and print one line"
      - "last-row: keep only the values from the last row for the suite"
      - "error: stop with a non-zero exit and name the repeated suite"
    default: "merge: sum passed and total across all rows for the suite and print one line"
    blocking: false

    chosen: "merge: sum passed and total across all rows for the suite and print one line"
  - id: AMB-003
    question: "What should the tool do when a suite's total is 0?"
    options:
      - "zero-rate: print a suite line with 0.0 as the percentage"
      - "skip-silent: omit the suite from the report and continue"
      - "error: stop with a non-zero exit and name the suite"
    default: "zero-rate: print a suite line with 0.0 as the percentage"
    blocking: false

    chosen: "zero-rate: print a suite line with 0.0 as the percentage"
  - id: AMB-004
    question: "How should a data row that cannot be parsed (wrong number of fields, non-integer passed or total, negative values, or passed greater than total) be handled?"
    options:
      - "stop-error: stop with a non-zero exit and a message naming the offending line"
      - "skip-silent: ignore the row and continue with the remaining rows"
    default: "stop-error: stop with a non-zero exit and a message naming the offending line"
    blocking: false

    chosen: "stop-error: stop with a non-zero exit and a message naming the offending line"
deliverable:
  run: "bash summary.sh {csv}"
  timeoutMs: 10000
  input_format:
    columns: "suite:id,passed:measure,total:other"
    sample: |
      login,45,50
      search,19,20
      billing,7,8
  output_format:
    suite_line:
      shape: "<suite> <passed> <total> <percentage>"
      fields: [id, numerator, denominator, ratio]
    total_line:
      shape: "TOTAL <passed_sum> <total_sum>"
      fields: [sum, sum]
  relations:
    - id: REL-001
      relation: derived-ratio
      decides: AMB-001
      description: "Each printed percentage equals its printed numerator divided by its printed denominator, multiplied by 100 and rounded to one decimal place the way AMB-001 decided."
  differential: