requirements:
  - id: REQ-001
    title: "Provide a CLI entry point that reads the CSV path given as its first argument"
    description: "The deliverable must ship an executable script `passrate.sh` at the repository root, invoked as `bash passrate.sh <csv>`, which reads the CSV file named by its first argument, writes its report to stdout, writes nothing to stdout that is not part of the declared output shapes, and exits with status 0 on a well-formed input."
    acceptance_criteria:
      - "`bash passrate.sh <sample.csv>` on the declared sample exits with status 0."
      - "`passrate.sh` exists at the repository root and takes the input file as `$1`; a judge substitutes its own fixture path for `{csv}`."
      - "A missing or unreadable input path makes the command exit non-zero and write a diagnostic to stderr."
    priority: High
    source: "'I want a command-line tool that reads a CSV of test run records'"

  - id: REQ-002
    title: "Print one line per suite with the pass percentage rounded to one decimal place"
    description: "For every distinct value of the `suite` column the tool prints exactly one report line `<suite> <passed> <total> <pct>`, where `<passed>` and `<total>` are the integers that entered the computation for that suite and `<pct>` is `passed / total * 100` rendered with exactly one digit after the decimal point, rounded the way AMB-001 decides."
    acceptance_criteria:
      - "A suite with passed=48, total=50 prints `48` and `50` and a percentage rendered as `96.0`."
      - "A suite with passed=17, total=20 prints `85.0`."
      - "Every per-suite line carries exactly one fractional digit in its percentage, including whole values such as 100 and 0 (printed `100.0`, `0.0`)."
      - "The percentage is derived from the same passed and total printed on that same line."
    priority: High
    source: "'prints one line per suite with the pass percentage rounded to one decimal place'"

  - id: REQ-003
    title: "Locate the columns by the header names, not by fixed positions"
    description: "The first CSV line is a header naming the columns `suite`, `passed` and `total`. The tool resolves each of those three columns by header name, so a file whose columns are in a different order, or that carries additional columns, is still read correctly; the header line itself is never reported as data."
    acceptance_criteria:
      - "A fixture whose header order is `total,suite,passed` yields the same report as the declared sample."
      - "No report line is produced from the header row."
      - "A header missing any of `suite`, `passed`, `total` makes the command exit non-zero naming the missing column."
    priority: High
    source: "'The CSV has a header row with columns: suite, passed, total.'"

  - id: REQ-004
    title: "Print one totals line summing the passed and total columns"
    description: "After the per-suite lines the tool prints exactly one summary line `TOTAL <passed_sum> <total_sum>` whose two integers are the sums of the `passed` and of the `total` values over every row that was counted. The request asks for no overall percentage, so the totals line carries none."
    acceptance_criteria:
      - "Exactly one line matching the totals shape is printed, and it is printed after the per-suite lines."
      - "On the declared sample the totals line reads `TOTAL 165 174` (48+17+99+1+0 and 50+20+100+1+3)."
      - "The totals are printed even when the input has a single suite."
    priority: High
    source: "'one line per suite' plus the report's whole; the request does not ask for an overall percentage"

  - id: REQ-005
    title: "Merge every row that names the same suite into that suite's single line"
    description: "When the `suite` value repeats, all of its rows contribute to one report line: the printed `<passed>` and `<total>` are the sums over those rows, and the percentage is computed from those sums. This is the behaviour AMB-002 selects; no automated relation in this document checks it yet, so it is carried here as requirement text and acceptance criterion only."
    acceptance_criteria:
      - "A fixture with two `auth` rows (48/50 and 1/1) prints one `auth` line with passed=49, total=51 and percentage `96.1`."
      - "The number of per-suite lines equals the number of distinct `suite` values, not the number of data rows."
    priority: Medium
    source: "'one line per suite' — the input may name the same suite on several rows"

  - id: REQ-006
    title: "Skip malformed rows, count them, and never print a suite line without usable counts"
    description: "A data row whose field count does not match the header, whose `passed` or `total` is not a non-negative integer, or whose `total` is zero, cannot produce a percentage; such a row is excluded from every suite and from the totals, and the number of excluded rows is reported on a final `SKIPPED <skipped_count>` line printed only when at least one row was skipped. This is the behaviour AMB-003 selects; no automated relation in this document checks it yet, so it is carried here as requirement text and acceptance criterion only."
    acceptance_criteria:
      - "A fixture with one unparsable `passed` value prints no line for that row's suite unless other valid rows for that suite exist, and prints `SKIPPED 1`."
      - "A fixture in which every row is valid prints no `SKIPPED` line at all."
      - "The totals line sums only the rows that produced a printed suite line."
      - "A suite whose only row has total=0 produces no per-suite line and increments the skipped count."
    priority: Medium
    source: "'reads a CSV of test run records' — the request does not say how unusable rows are treated"
ambiguities:
  - id: AMB-001
    question: "How is the one-decimal percentage rounded when the stored value falls exactly on a half, and how does an independent recomputation round it?"
    options:
      - "half-up: round half away from zero, so 96.05 becomes 96.1"
      - "truncate: drop every digit beyond the first decimal, so 96.09 becomes 96.0"
    default: "half-up: round half away from zero, so 96.05 becomes 96.1"
    checkedAs: half-up
    blocking: true
    chosen: "half-up: round half away from zero, so 96.05 becomes 96.1"
  - id: AMB-002
    question: "When the same suite name appears on several rows, which occurrence wins?"
    options:
      - "merge: every row of that suite counts, so passed and total are summed into one line"
      - "last-row: only the last occurrence of that suite is kept"
      - "first-row: only the first occurrence of that suite is kept"
      - "error: a repeated suite name stops the command with a non-zero exit"
    default: "merge: every row of that suite counts, so passed and total are summed into one line"
    blocking: false
    chosen: "merge: every row of that suite counts, so passed and total are summed into one line"
  - id: AMB-003
    question: "What happens to a data row that cannot yield a percentage (wrong field count, non-integer or negative passed/total, or total equal to zero)?"
    options:
      - "skip-count: skip the row, exclude it from the totals, and report it on a SKIPPED line"
      - "skip-silent: skip the row and print no trace of it"
      - "stop-error: stop with a non-zero exit naming the offending line"
    default: "skip-count: skip the row, exclude it from the totals, and report it on a SKIPPED line"
    blocking: false
    chosen: "skip-count: skip the row, exclude it from the totals, and report it on a SKIPPED line"
deliverable:
  run: "bash passrate.sh {csv}"
  timeoutMs: 120000
  input_format:
    columns: "suite:id,passed:measure,total:other"
    sample: |
      auth,48,50
      billing,17,20
      search,99,100
      auth,1,1
      billing,0,3
  output_format:
    suite_line:
      shape: "<suite> <passed> <total> <pct>"
      fields: [id, numerator, denominator, ratio]
    total_line:
      shape: "TOTAL <passed_sum> <total_sum>"
      fields: [sum, sum]
    skipped_line:
      shape: "SKIPPED <skipped_count>"
      fields: [skipped-count]
  relations:
    - id: REL-001
      relation: derived-ratio
      decides: AMB-001
      description: "Every printed percentage equals its own line's printed passed divided by its own line's printed total, times 100, rounded to one decimal the way AMB-001 decided."
  differential:
    - id: DIFF-001
      anchor: derived-ratio
      decides: AMB-001
      description: "An independent recomputation of each suite's percentage from the printed passed and total, rounded half-up to one decimal place, matches the printed percentage, and an independent pass over the input rows yields the same set of suites and the same totals."
