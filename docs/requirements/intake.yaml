requirements:
  - id: REQ-001
    title: "Provide the common-keys command-line entry point"
    description: "The repository root must contain a shell entry point named common-keys.sh that takes the path of the JSON input file as its first positional argument ($1) and carries out the whole task with no other input."
    acceptance_criteria:
      - "Running `bash common-keys.sh <file>` reads the file named by $1 and requires no other arguments and no stdin."
      - "The command exits 0 for a valid input and writes the result to standard output."
    priority: High
    source: "I want a small command-line tool that reads a JSON file"
  - id: REQ-002
    title: "Accept a JSON array of objects as input"
    description: "The input file must hold a single JSON value that is an array whose elements are objects; each element object contributes its key set to the computation."
    acceptance_criteria:
      - "A well-formed JSON file whose top-level value is an array of objects is accepted."
      - "A top-level value that is not an array of objects is not treated as a valid input."
    priority: High
    source: "reads a JSON file holding an array of objects"
  - id: REQ-003
    title: "Compute the keys common to every object"
    description: "The tool must report exactly those keys that are present in every object of the input array; a key missing from any single object is not reported."
    acceptance_criteria:
      - "A key present in all input objects is printed."
      - "A key present in at least one object but not in all of them is not printed."
      - "When the objects share at least one key, only the shared keys are printed."
    priority: High
    source: "prints the keys that appear in every one of those objects"
  - id: REQ-004
    title: "Print one key per line in alphabetical order"
    description: "Each common key must be printed on its own line, and the printed keys must be sorted in ascending alphabetical order."
    acceptance_criteria:
      - "Exactly one common key appears on each output line, with no extra text on the line."
      - "The printed keys appear in ascending alphabetical order."
    priority: High
    source: "one per line, sorted alphabetically"
  - id: REQ-005
    title: "Print none when no key is common"
    description: "When no key is shared by every object, the tool must print the single word none and nothing else."
    acceptance_criteria:
      - "An input whose objects share no key produces exactly the single line `none`."
      - "The literal `none` is printed only when there is no common key."
    priority: High
    source: "or the single word none when no key is common to all of them"
  - id: REQ-006
    title: "Ship a runnable test suite with a TAP report"
    description: "The deliverable must include its own automated tests that assert the common-key behaviour and run as `bash run-tests.sh`, writing a TAP report to reports/tests.tap."
    acceptance_criteria:
      - "`bash run-tests.sh` completes, exits 0, and writes a TAP report to reports/tests.tap."
      - "The TAP report contains no failing test line."
      - "The tests cover the all-shared case, the partially-shared case and the none case."
    priority: High
    source: "Implied by the deliverable contract: the answer must be checked by the tests the deliverable ships"
  - id: REQ-007
    title: "Apply the recorded decisions for behaviour no relation checks"
    description: "The choices recorded for key scope (AMB-001), malformed input (AMB-002), empty input (AMB-003) and sort order (AMB-004) must be applied consistently. No declared relation exercises any of these choices, so a judge reports them as not mechanised."
    acceptance_criteria:
      - "Key scope follows AMB-001, malformed-input handling follows AMB-002, empty-input handling follows AMB-003, and sort order follows AMB-004."
      - "None of these behaviours is claimed as mechanised by any relation."
    priority: Medium
    source: "Decisions the request leaves open; the available relation vocabulary for this shape cannot exercise them"
ambiguities:
  - id: AMB-001
    question: "What counts as a key of an object: only the object's own top-level keys, or also nested keys flattened into paths?"
    options:
      - "top-level: only the keys directly present on each object are considered"
      - "deep-paths: keys nested inside sub-objects are flattened into dotted paths and also considered"
    default: "top-level: only the keys directly present on each object are considered"
    blocking: false
    chosen: "top-level: only the keys directly present on each object are considered"
  - id: AMB-002
    question: "What should happen when the JSON does not parse or an element of the array is not an object?"
    options:
      - "stop-error: print a diagnostic and exit non-zero without printing a key list"
      - "skip-silent: ignore the unusable element and compute the key set from the remaining objects"
    default: "stop-error: print a diagnostic and exit non-zero without printing a key list"
    blocking: false
    chosen: "stop-error: print a diagnostic and exit non-zero without printing a key list"
  - id: AMB-003
    question: "What should be printed when the input array contains no objects at all?"
    options:
      - "none: print the single line none"
      - "error: exit non-zero because there is no object to intersect"
    default: "none: print the single line none"
    blocking: false
    chosen: "none: print the single line none"
  - id: AMB-004
    question: "How are the common keys ordered when their names differ only by case?"
    options:
      - "codepoint: sort by Unicode code point, so uppercase letters precede lowercase ones"
      - "case-insensitive: sort case-insensitively, breaking ties by code point"
    default: "codepoint: sort by Unicode code point, so uppercase letters precede lowercase ones"
    blocking: false
    chosen: "codepoint: sort by Unicode code point, so uppercase letters precede lowercase ones"
deliverable:
  run: "bash common-keys.sh {json}"
  timeoutMs: 10000
  scenarios:
    - id: SCN-001
      run: "bash run-tests.sh"
      expect: "the delivered tests pass and assert the set of keys common to every object, printed one per line or as none"
      report: tap
      report_path: "reports/tests.tap"
      description: "Run the delivered test suite and read its TAP report."
  relations:
    - id: REL-001
      relation: mutation-detection
      description: "The delivered tests fail when the delivered behaviour is mutated."
  mutation:
    run: "npx stryker run --reporters json"
    report_path: "reports/mutation/mutation.json"
    format: survivors-json
    max_survivors: 0
