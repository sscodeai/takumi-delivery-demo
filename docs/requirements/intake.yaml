requirements:
  - id: REQ-001
    title: "Provide the summary.sh CLI entry point"
    description: "The deliverable provides an executable script `summary.sh` at the repository root. It is invoked as `bash summary.sh <csv>`, reads the input file path from `$1`, writes the report to stdout, and exits 0 after a successful run."
    acceptance_criteria:
      - "`bash summary.sh <path>` exits 0 and writes the report to stdout when the file exists and is readable."
      - "When `$1` is missing, the file does not exist, or it cannot be read, the tool writes an error message to stderr, prints no report lines to stdout, and exits non-zero."
    priority: High
    source: "I want a command-line tool that reads a CSV of sales records"
  - id: REQ-002
    title: "Parse the region/amount CSV and its header"
    description: "The input is a CSV file whose first line is a header naming the columns `region` and `amount` in that order. Header names are matched case-insensitively after trimming surrounding whitespace. Data rows follow, one record per line. Standard RFC 4180 quoting is honoured, so a quoted region may contain a comma. A missing, unreadable, or wrong header is a fatal error."
    acceptance_criteria:
      - "A file whose header is `region,amount` is accepted; a file whose header is `Region , Amount` is also accepted."
      - "A file without a header, or with a header that does not name exactly `region` and `amount` in that order, produces a fatal error: non-zero exit and no report lines."
      - "A data row `\"North, East\",100.00` yields one record with region `North, East` and amount `100.00`."
    priority: High
    source: "The CSV has a header row with columns: region, amount."
  - id: REQ-003
    title: "Aggregate revenue and average order value per region"
    description: "Records are grouped by region, using the region string after trimming leading and trailing whitespace. For each region the tool prints exactly one line `<region> <count> <sum> <mean>`, where count is the number of accepted rows in the group, sum is the group's total amount, and mean is sum divided by count. Lines are sorted ascending by region using byte-wise UTF-8 comparison, so the output does not depend on input order. Sum and mean are printed with exactly two decimal places."
    acceptance_criteria:
      - "Rows `north,120.50` and `north,99.50` produce the line `north 2 220.00 110.00`."
      - "Region lines appear in ascending byte-wise region order, exactly one line per distinct region."
      - "For every region line, `mean` equals `sum / count` rounded as AMB-003 decides, and `sum` equals the sum of that group's accepted amounts."
    priority: High
    source: "prints the total revenue and the average order value per region"
  - id: REQ-004
    title: "Print exactly one totals line"
    description: "After the region lines the tool prints exactly one totals line `TOTAL <count> <sum>`, where count is the total number of accepted rows and sum is the total revenue over all regions. The totals line is always printed, including for a header-only file."
    acceptance_criteria:
      - "The sum of the per-region counts equals the count on the TOTAL line."
      - "The sum of the per-region sums equals the sum on the TOTAL line, allowing only the two-decimal printing."
      - "A header-only file prints `TOTAL 0 0.00` and no region lines."
    priority: High
    source: "prints the total revenue ... per region"
  - id: REQ-005
    title: "Account for malformed data rows as AMB-001 decides"
    description: "A data row that cannot be parsed as a record is handled the way AMB-001 decides. Under the proposed default the row is skipped, excluded from every aggregate, and counted on a `SKIPPED <skipped-count>` line printed once after the TOTAL line. Malformed means: a field count other than two, an empty region after trimming, or an amount that is not a plain decimal number (optional sign, digits, optional fractional part; no currency symbols, thousands separators or exponent notation)."
    acceptance_criteria:
      - "A file containing a row `north,abc` produces the same region and TOTAL aggregates as if that row were absent, and the SKIPPED count is one larger."
      - "The SKIPPED line appears exactly once, after the TOTAL line, and carries the total number of skipped data rows."
      - "A file with no malformed rows prints `SKIPPED 0`."
    priority: High
    source: "Implicit: the request does not say what to do with unparseable rows; recorded as AMB-001."
  - id: REQ-006
    title: "Treat repeated rows as AMB-002 decides"
    description: "Repeated rows are resolved the way AMB-002 decides. Under the proposed default every row is an independent order: identical region/amount rows each count toward count, sum and mean, and no de-duplication is performed."
    acceptance_criteria:
      - "Two identical rows `south,50.00` produce `south 2 100.00 50.00`."
      - "The TOTAL count includes every accepted data row, including repeats."
    priority: High
    source: "Implicit: the request does not say whether repeated records are one order or several; recorded as AMB-002."
  - id: REQ-007
    title: "Format and round monetary values reproducibly"
    description: "Amounts are read as decimal numbers and all printed monetary values (sum, mean, total sum) use exactly two decimal places with no thousands separators and no currency symbol. Rounding follows AMB-003; the proposed default is half-up, rounding half away from zero. The tool uses decimal arithmetic rather than binary floating point so printed values are reproducible."
    acceptance_criteria:
      - "A mean of 10 / 3 is printed as `3.33`; a value of `2.005` is printed as `2.01` under half-up."
      - "Printed sums and means always have exactly two digits after the decimal point, including trailing zeros."
      - "The same input produces byte-identical stdout on repeated runs."
    priority: High
    source: "Implicit: precision of revenue and average values; recorded as AMB-003."
  - id: REQ-008
    title: "Accept zero and negative amounts and keep regions case-sensitive"
    description: "Zero and negative amounts are valid orders. They are included in count, sum and mean exactly like positive amounts; no refund or sign special-casing is applied. Regions are case-sensitive: `North` and `north` are distinct groups."
    acceptance_criteria:
      - "Rows `east,-10.00` and `east,30.00` produce `east 2 20.00 10.00`."
      - "Rows `North,10.00` and `north,20.00` produce two region lines."
    priority: Medium
    source: "Implicit: the request does not restrict amount signs or region casing."
  - id: REQ-009
    title: "Make the report independent of input row order"
    description: "The report depends only on the multiset of accepted records, not on the order in which rows appear in the file. Any permutation of the data rows yields byte-identical stdout."
    acceptance_criteria:
      - "Running the tool on a file and on a shuffled copy of the same data rows produces identical stdout."
      - "Region lines are sorted, so shuffling never changes their order."
    priority: Medium
    source: "Implicit: CSV row order is not meaningful for an aggregate report."
  - id: REQ-010
    title: "Ship an automated test suite for the behaviour"
    description: "The project ships an automated test suite runnable from the repository root that covers at least per-region aggregation, the totals line, malformed-row accounting, repeated rows, rounding, and order independence. The suite exits non-zero on failure."
    acceptance_criteria:
      - "A single documented command runs the test suite and exits 0 on a correct implementation."
      - "The suite contains at least one test for each of the behaviours in REQ-003, REQ-004, REQ-005, REQ-006 and REQ-007."
    priority: Medium
    source: "Implicit: the delivered tool must keep working; no judge relation checks this requirement directly."
ambiguities:
  - id: AMB-001
    question: "What should the tool do with a data row it cannot parse (wrong field count, empty region, or non-numeric amount)?"
    options:
      - "skip-count: skip the row, exclude it from every aggregate, and report it on a SKIPPED line"
      - "skip-silent: skip the row and exclude it, printing no SKIPPED line"
      - "stop-error: stop at the first malformed row, print no report, and exit non-zero"
    default: "skip-count: skip the row, exclude it from every aggregate, and report it on a SKIPPED line"
    checkedAs: skip-count
    blocking: true
    chosen: "skip-count: skip the row, exclude it from every aggregate, and report it on a SKIPPED line"
  - id: AMB-002
    question: "When two data rows are identical (same region and same amount), how are they treated?"
    options:
      - "merge: every occurrence counts as its own order"
      - "first-row: only the first identical row is kept"
      - "error: a repeated identical row is a fatal error"
    default: "merge: every occurrence counts as its own order"
    checkedAs: merge
    blocking: true
    chosen: "merge: every occurrence counts as its own order"
  - id: AMB-003
    question: "How are printed sums and means rounded to two decimal places?"
    options:
      - "half-up: round half away from zero"
      - "truncate: drop digits beyond two decimal places"
    default: "half-up: round half away from zero"
    checkedAs: half-up
    blocking: true
    chosen: "half-up: round half away from zero"
deliverable:
  run: "bash summary.sh {csv}"
  timeoutMs: 30000
  input_format:
    columns: "region:id,amount:measure"
    sample: |
      north,120.50
      south,80.00
      north,99.50
      east,45.25
  output_format:
    region_line:
      shape: "<region> <count> <sum> <mean>"
      fields: [id, count, sum, mean]
    total_line:
      shape: "TOTAL <count> <sum>"
      fields: [count, sum]
    skipped_line:
      shape: "SKIPPED <skipped-count>"
      fields: [skipped-count]
  relations:
    - id: REL-001
      relation: malformed-row-accounting
      decides: AMB-001
      description: "A malformed data row is skipped, excluded from every aggregate, and counted on the SKIPPED line the way AMB-001 decided."
    - id: REL-002
      relation: duplicate-resolution
      decides: AMB-002
      description: "Repeated identical rows resolve the way AMB-002 decided; under the default each occurrence counts as its own order."
    - id: REL-003
      relation: additivity
      description: "The per-region counts sum to the count on the TOTAL line, and the per-region sums sum to the sum on the TOTAL line."
    - id: REL-004
      relation: row-order-invariance
      description: "Shuffling the data rows leaves the printed report byte-identical."
  differential:
    - id: DIFF-001
      anchor: independent-aggregation
      decides: AMB-003
      description: "An independent recomputation of each region's count, sum and mean from the fixture rows matches the tool's printed values, rounded the way AMB-003 decided."
