requirements:
  - id: REQ-001
    title: "Ship a command-line entry point that reads a support-ticket CSV"
    description: "The repository root must contain `ticket-summary.sh`, invoked as `bash ticket-summary.sh <csv-path>`, which reads the support-ticket CSV named by `$1`, writes the counts report to stdout, and exits 0 on success. A path that is missing or unreadable exits non-zero with a diagnostic on stderr. This script is the entry point declared as `deliverable.run`."
    acceptance_criteria:
      - "`bash ticket-summary.sh <csv-path>` on a valid CSV exits 0 and writes only the report to stdout."
      - "`bash ticket-summary.sh no-such-file.csv` exits non-zero and writes a diagnostic to stderr."
      - "The entry point is `ticket-summary.sh` at the repository root, exactly as declared in `deliverable.run`."
    priority: High
    source: "I want a command-line tool that reads a CSV of support tickets"

  - id: REQ-002
    title: "Locate the assignee and status columns from the header row"
    description: "The first line of the CSV is a header row that names the columns. The tool locates `assignee` and `status` by header name, so the two columns may appear in either order and may sit beside columns it ignores. A header that lacks either name is a usage error: non-zero exit, diagnostic on stderr, nothing on stdout. A file with a valid header and no data rows succeeds and prints only the totals line."
    acceptance_criteria:
      - "A CSV whose header is `status,assignee` produces the same report as one whose header is `assignee,status`."
      - "A CSV whose header lacks `status` exits non-zero and prints nothing on stdout."
      - "A header-only CSV exits 0 and prints `TOTAL 0 0`."
    priority: High
    source: "The CSV has a header row with columns: assignee, status"

  - id: REQ-003
    title: "Print one open/closed count line per assignee"
    description: "For every distinct assignee that appears in at least one counted data row, print exactly one line of the form `<assignee> <open> <closed>`, where `<open>` is the number of that assignee's rows whose status equals `open` and `<closed>` is the number whose status equals `closed`, compared case-insensitively after trimming surrounding whitespace from both fields. Assignee values are printed trimmed and otherwise as read. Lines are ordered by assignee ascending under a locale-independent byte comparison, so two runs over the same data are directly comparable."
    acceptance_criteria:
      - "A fixture where alice has three `open` rows and two `closed` rows prints the line `alice 3 2` and no other line for alice."
      - "An assignee with no rows in one status still prints both numbers, for example `bob 1 0`."
      - "Per-assignee lines are emitted in ascending byte order of the assignee string."
    priority: High
    source: "prints how many tickets each assignee has open and closed"

  - id: REQ-004
    title: "Print a single totals line that sums the per-assignee counts"
    description: "After the per-assignee lines, print exactly one line `TOTAL <open-sum> <closed-sum>`, where each value is the sum of that column over all printed per-assignee lines. The totals line is the only stdout line that is not a per-assignee line, so no banner, blank line, or debug text goes to stdout. With no counted rows the whole report is exactly `TOTAL 0 0`."
    acceptance_criteria:
      - "The two numbers on the TOTAL line equal the column sums of the per-assignee lines."
      - "A fixture with two assignees (2 open/1 closed and 1 open/3 closed) ends with `TOTAL 3 4`."
      - "stdout contains no line other than per-assignee lines and the single TOTAL line."
    priority: High
    source: "how many tickets each assignee has open and closed"

  - id: REQ-005
    title: "Count only recognised status values"
    description: "A status value counts as `open` only when it equals `open` case-insensitively, and as `closed` only when it equals `closed` case-insensitively. Any other status value is not counted and makes its row unusable, handled as REQ-006 describes; AMB-001 records the alternative reading. No generated judge checks AMB-001 through AMB-005: the only automated checks declared here are the delivered test suite and its mutation report, so the implementation must pin each chosen reading in its own tests."
    acceptance_criteria:
      - "A row with status `pending` appears in neither the open nor the closed count."
      - "`Open` and `CLOSED`, with surrounding whitespace, are counted as the two recognised statuses."
      - "The behaviour for an unrecognised status is exercised by at least one delivered test."
    priority: Medium
    source: "columns: assignee, status"

  - id: REQ-006
    title: "Skip unusable rows, count them, and keep them off stdout"
    description: "A data row with the wrong number of fields, an empty assignee, an empty status, or an unrecognised status is unusable: it contributes to no count and never creates an assignee entry. The tool reports how many rows it skipped as one diagnostic line on stderr, for example `skipped 2 rows`, and still exits 0. stdout carries only the per-assignee lines of REQ-003 and the totals line of REQ-004. AMB-002 records the alternatives; no generated judge checks this choice."
    acceptance_criteria:
      - "A fixture with one malformed row among four valid rows prints the same stdout report as the same fixture without that row."
      - "The skipped-row diagnostic appears on stderr and never on stdout."
      - "The diagnostic states how many rows were skipped."
    priority: Medium
    source: "reads a CSV of support tickets (rows the tool cannot use must not corrupt the counts)"

  - id: REQ-007
    title: "Ship an automated test suite that writes a TAP report"
    description: "`bash run-tests.sh` at the repository root runs the delivered test suite, exits 0 when every test passes, exits non-zero otherwise, and writes a TAP report to `reports/tests.tap`. The suite covers several assignees, both statuses, an assignee with no rows in one status, a header whose columns are in reversed order, a malformed row that is skipped, and the totals line matching the per-assignee sums. This is the command the `SCN-001` scenario runs and whose report it reads."
    acceptance_criteria:
      - "`bash run-tests.sh` exits 0 and leaves a readable TAP report at `reports/tests.tap` with no `not ok` line."
      - "The report records assertions for per-assignee counts, the TOTAL line, reversed header order, and skipped malformed rows."
      - "The suite exits non-zero with a `not ok` line in the report when the counting or the totals arithmetic is deliberately broken."
    priority: High
    source: "a command-line tool whose counting can be verified"

  - id: REQ-008
    title: "Ship a mutation harness that writes a survivors-json report"
    description: "`bash mutation/run-mutation.sh` applies behaviour-changing mutations to the counting logic (for example flipping the open/closed comparison, dropping the totals accumulation, or removing the ordering), runs the delivered test suite against each mutant, and writes a tool-agnostic verdict to `reports/mutation/mutation.json` shaped `{\"total\": <int>, \"survivors\": [{\"file\": ..., \"line\": ..., \"description\": ...}]}` with `total` at least 1 and zero survivors for the correct implementation. This is the command declared in `deliverable.mutation`."
    acceptance_criteria:
      - "`bash mutation/run-mutation.sh` writes `reports/mutation/mutation.json` whose `total` is an integer of at least 1."
      - "Against the correct implementation the report's `survivors` list is empty."
      - "A mutant that produces a wrong count or a wrong total is reported as killed, that is absent from `survivors`, because the delivered tests fail on it."
    priority: Medium
    source: "the tool's counting must be checkable, not merely green"

  - id: REQ-009
    title: "State the recorded decisions in the documentation and pin them with tests"
    description: "AMB-001 through AMB-005 are the readings this request leaves open. No generated judge checks them, so the implementation must fix each one explicitly in a README section and exercise each choice that changes observable output with at least one delivered test. Where a choice does change output, the test names the chosen behaviour so a reader can tell which reading was adopted."
    acceptance_criteria:
      - "The README lists the adopted reading for AMB-001 through AMB-005."
      - "At least one delivered test covers each choice that changes observable output."
    priority: Low
    source: "the request does not settle status vocabulary, malformed rows, name casing, duplicate rows, or quoting"
ambiguities:
  - id: AMB-001
    question: "Which status values count as open and as closed?"
    options:
      - "strict: only case-insensitive `open` and `closed` are counted; every other value makes the row unusable"
      - "closed-binary: every value other than `closed` counts as open, so `pending` and `in-progress` are open tickets"
    default: "strict: only case-insensitive `open` and `closed` are counted; every other value makes the row unusable"
    blocking: false

    chosen: "strict: only case-insensitive `open` and `closed` are counted; every other value makes the row unusable"
  - id: AMB-002
    question: "What does the tool do with a row it cannot use (wrong field count, empty assignee, empty status, or unrecognised status)?"
    options:
      - "skip-count: skip the row, exclude it from every count, report the number skipped on stderr, and still exit 0"
      - "skip-silent: skip the row silently and exit 0"
      - "stop-error: abort with a non-zero exit and a diagnostic naming the bad row"
    default: "skip-count: skip the row, exclude it from every count, report the number skipped on stderr, and still exit 0"
    blocking: false

    chosen: "skip-count: skip the row, exclude it from every count, report the number skipped on stderr, and still exit 0"
  - id: AMB-003
    question: "Are assignee names compared case-sensitively when rows are grouped?"
    options:
      - "case-sensitive: `Alice` and `alice` are two assignees, each printed with the spelling it carries"
      - "merge-case-insensitive: they are one assignee, printed under the spelling of its first row"
    default: "case-sensitive: `Alice` and `alice` are two assignees, each printed with the spelling it carries"
    blocking: false

    chosen: "case-sensitive: `Alice` and `alice` are two assignees, each printed with the spelling it carries"
  - id: AMB-004
    question: "Do two rows with the same assignee and the same status describe two tickets or one?"
    options:
      - "count-each-row: every data row is its own ticket, so two identical rows count twice"
      - "dedupe-identical: rows identical in every column collapse into one ticket"
    default: "count-each-row: every data row is its own ticket, so two identical rows count twice"
    blocking: false

    chosen: "count-each-row: every data row is its own ticket, so two identical rows count twice"
  - id: AMB-005
    question: "Must the CSV reader honour RFC 4180 quoted fields?"
    options:
      - "quoted-aware: honour double-quoted fields, including embedded commas and doubled quotes inside an assignee name"
      - "plain-split: split every line on commas and treat quote characters as ordinary text"
    default: "quoted-aware: honour double-quoted fields, including embedded commas and doubled quotes inside an assignee name"
    blocking: false
    chosen: "quoted-aware: honour double-quoted fields, including embedded commas and doubled quotes inside an assignee name"
deliverable:
  run: "bash ticket-summary.sh {csv}"
  timeoutMs: 30000
  scenarios:
    - id: SCN-001
      run: "bash run-tests.sh"
      expect: "the delivered test suite passes and its TAP report records passing assertions for per-assignee open/closed counts, the TOTAL line, reversed header order, and skipped malformed rows"
      report: tap
      report_path: "reports/tests.tap"
      description: "Run the delivered test suite and read the TAP report it writes."
  relations:
    - id: REL-001
      relation: mutation-detection
      description: "The delivered tests fail when the delivered counting behaviour is mutated."
  mutation:
    run: "bash mutation/run-mutation.sh"
    report_path: "reports/mutation/mutation.json"
    format: survivors-json
    max_survivors: 0
    timeoutMs: 600000
