requirements:
  - id: REQ-001
    title: "Provide summary.sh as the command-line entry point"
    description: "The repository root must contain a script summary.sh invoked as `bash summary.sh <csv>`, where <csv> is the path to a support-ticket CSV file. It reads that file, prints the per-assignee counts to stdout, requires no interactive input, and exits 0 on success. The repository also ships sample/tickets.csv so that the documented invocation `bash summary.sh sample/tickets.csv` works on a clean checkout with only the toolchain already present on the machine."
    acceptance_criteria:
      - "`bash summary.sh sample/tickets.csv` exits 0 and prints the report to stdout from a clean checkout."
      - "`summary.sh` exists at the repository root and takes the CSV path as its first argument."
      - "No network access, service, or interactive prompt is needed to run it."
    priority: High
    source: "I want a command-line tool that reads a CSV of support tickets and prints ..."
  - id: REQ-002
    title: "Locate columns by header name and parse RFC 4180 CSV"
    description: "The first line of the input is a header naming at least the columns `assignee` and `status`. Columns are located by header name, not by position, so a file whose two columns appear in the other order, or that carries additional columns, is still read correctly. Fields follow RFC 4180 quoting: a quoted field may contain commas, doubled quotes and embedded newlines; records end with LF or CRLF."
    acceptance_criteria:
      - "A file whose header is `status,assignee` yields the same report as the same rows under `assignee,status`."
      - "A quoted assignee value containing a comma is reported as one assignee name."
      - "A file carrying an extra unrelated column still yields the correct counts."
    priority: High
    source: "The CSV has a header row with columns: assignee, status."
  - id: REQ-003
    title: "Count open and closed tickets per assignee"
    description: "For every distinct assignee the tool counts that assignee's rows whose status is open and those whose status is closed, and prints exactly one line per assignee of the form `<assignee> <open_count> <closed_count>`, single-space separated, both numbers decimal integers. A class with no tickets prints 0 in its position. Every counted data row contributes to exactly one assignee line and one status count."
    acceptance_criteria:
      - "An assignee with three open and one closed ticket prints `alice 3 1`."
      - "An assignee with only closed tickets prints an open count of 0."
      - "Across all printed lines, total open plus total closed equals the number of counted data rows."
    priority: High
    source: "prints how many tickets each assignee has open and closed"
  - id: REQ-004
    title: "Print a deterministic, locale-independent report order"
    description: "Assignee lines are sorted by assignee in byte order (C-locale collation) so that two runs over the same input, and runs over a row-shuffled version of it, produce identical bytes. The output carries no timestamps, absolute paths, or locale-dependent number formatting."
    acceptance_criteria:
      - "Shuffling the data rows of a fixture does not change the output byte for byte."
      - "Running the tool twice over the same fixture produces identical bytes."
    priority: Medium
    source: "Not stated in the request; settled here so the printed report is reproducible."
  - id: REQ-005
    title: "Print nothing for a file with no counted rows"
    description: "A file that contains only the header, or whose data rows are all skipped under the malformed-row decision, produces no report lines and exits 0. The tool does not invent a zero-filled line for an assignee it never saw."
    acceptance_criteria:
      - "A header-only fixture produces empty stdout and exit status 0."
      - "No assignee name absent from the data appears in the output."
    priority: Medium
    source: "Not stated in the request; settled here in prose so the requirement text is complete."
  - id: REQ-006
    title: "Ship an automated test suite that pins the counting behaviour"
    description: "The repository must contain run-tests.sh at its root, which runs the project's test suite and writes a TAP report to reports/tests.tap. The suite owns its fixtures and asserts the exact stdout of summary.sh for at least: mixed open/closed counts, an assignee with only one status, row shuffling, a header-only file, and each decision AMB-001 to AMB-004 in the form chosen by its default (or by the answer a human gives). The suite must fail when any expectation is violated. No independent judge recomputes these decisions: the delivered tests and the mutation check are the only mechanised evidence for them."
    acceptance_criteria:
      - "`bash run-tests.sh` exits 0 and writes reports/tests.tap with no failing TAP line."
      - "The suite reports a failure (nonzero exit, failing TAP line) when a fixture expectation is deliberately broken."
      - "Each decision AMB-001 through AMB-004 has at least one test whose fixture exercises it."
    priority: High
    source: "Shape decision: the requested CSV carries no numeric measure column to aggregate, so the answer is checked by the delivered tests rather than by a recomputed aggregate."
  - id: REQ-007
    title: "Ship a mutation harness that leaves no surviving mutant"
    description: "The repository must contain mutation/run.sh, which runs a mutation tool over the implementation that summary.sh executes and writes a tool-agnostic report `{\"total\": <int>, \"survivors\": [...]}` to reports/mutation/mutation.json. The run must measure at least one mutant and leave zero survivors: the delivered test suite has to fail for every mutated implementation."
    acceptance_criteria:
      - "`bash mutation/run.sh` writes reports/mutation/mutation.json with `total` greater than 0 and an empty `survivors` list."
      - "The harness exits nonzero when any mutant survives."
    priority: Medium
    source: "Not stated in the request; required so the delivered tests are shown to be able to fail."
ambiguities:
  - id: AMB-001
    question: "Which status values count as open and as closed, and what happens to any other status value?"
    options:
      - "exact-match: only `open` and `closed` are counted, compared case-insensitively after trimming surrounding whitespace; any other status value is skipped and reported as a skipped count on stderr"
      - "binary: any status other than `closed` counts as open"
      - "strict: a status value other than `open` or `closed` stops the run with a nonzero exit and a message naming the line"
    default: "exact-match: only `open` and `closed` are counted, compared case-insensitively after trimming surrounding whitespace; any other status value is skipped and reported as a skipped count on stderr"
    blocking: false
    chosen: "exact-match: only `open` and `closed` are counted, compared case-insensitively after trimming surrounding whitespace; any other status value is skipped and reported as a skipped count on stderr"
  - id: AMB-002
    question: "Does each assignee get one line carrying both counts, or one line per assignee-and-status pair?"
    options:
      - "one-line-per-assignee: `<assignee> <open_count> <closed_count>`"
      - "one-line-per-pair: `<assignee> <status> <count>`"
      - "wide-with-total: one line per assignee plus a trailing TOTAL line holding the summed open and closed counts"
    default: "one-line-per-assignee: `<assignee> <open_count> <closed_count>`"
    blocking: false
    chosen: "one-line-per-assignee: `<assignee> <open_count> <closed_count>`"
  - id: AMB-003
    question: "What happens to a data row whose assignee or status field is empty, and to a file whose header lacks the required columns?"
    options:
      - "skip-count: such rows are skipped, their number is reported on stderr, and the run still exits 0; a header without `assignee` and `status` stops with a clear stderr message and a nonzero exit"
      - "skip-silent: bad rows are dropped silently and a file without a usable header is treated as empty input with exit 0"
      - "stop-error: the first bad row or unusable header stops the run with a nonzero exit and a message naming the line number"
    default: "skip-count: such rows are skipped, their number is reported on stderr, and the run still exits 0; a header without `assignee` and `status` stops with a clear stderr message and a nonzero exit"
    blocking: false
    chosen: "skip-count: such rows are skipped, their number is reported on stderr, and the run still exits 0; a header without `assignee` and `status` stops with a clear stderr message and a nonzero exit"
  - id: AMB-004
    question: "Are assignee names normalised before grouping, so that spelling variants merge into one line or stay separate?"
    options:
      - "trim-case-sensitive: surrounding whitespace is trimmed and case is preserved, so `Alice` and `alice` are two assignees"
      - "trim-case-insensitive: surrounding whitespace is trimmed and names are compared case-insensitively, printing the first spelling seen"
      - "raw: the field is used exactly as it appears, whitespace included"
    default: "trim-case-sensitive: surrounding whitespace is trimmed and case is preserved, so `Alice` and `alice` are two assignees"
    blocking: false
    chosen: "trim-case-sensitive: surrounding whitespace is trimmed and case is preserved, so `Alice` and `alice` are two assignees"
deliverable:
  run: "bash summary.sh {csv}"
  timeoutMs: 30000
  scenarios:
    - id: SCN-001
      run: "bash run-tests.sh"
      expect: "the delivered test suite passes and asserts, assignee by assignee, the number of open and closed tickets that summary.sh prints, including the skipped-row and shuffling cases"
      report: tap
      report_path: "reports/tests.tap"
      description: "Run the delivered test suite and read its TAP report."
  relations:
    - id: REL-001
      relation: mutation-detection
      description: "The delivered tests fail when the delivered counting behaviour is mutated."
  mutation:
    run: "bash mutation/run.sh"
    report_path: "reports/mutation/mutation.json"
    format: survivors-json
    max_survivors: 0
    timeoutMs: 900000
