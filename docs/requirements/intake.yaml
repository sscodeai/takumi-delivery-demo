requirements:
  - id: REQ-001
    title: "Provide the common-keys command-line entry point"
    description: "The deliverable provides an executable script named common-keys.sh at the repository root. It is invoked as `bash common-keys.sh <path-to-json>` and takes the JSON file path as its first positional argument. It reads the JSON file and writes its result to standard output."
    acceptance_criteria:
      - "Running `bash common-keys.sh <file>` on a valid JSON file whose top level is an array of objects exits with status 0."
      - "The result is written to standard output, not stderr, and the process terminates on its own."
    priority: High
    source: "Request: 'a small command-line tool that reads a JSON file'."

  - id: REQ-002
    title: "Intersect the keys of every object in the array"
    description: "The reported keys are exactly those key names (exact string match) that are present in every object of the top-level array. A key missing from any single object is not reported."
    acceptance_criteria:
      - "Given objects with keys {a,b}, {a,c}, {a,b}, the tool reports only 'a'."
      - "A key present in all but one object is absent from the output."
    priority: High
    source: "'prints the keys that appear in every one of those objects'."

  - id: REQ-003
    title: "Print one common key per line in ascending alphabetical order"
    description: "Each common key is printed on its own line to standard output. Lines are emitted in ascending alphabetical order, interpreted as ascending Unicode code point order of the key strings; because intersection keys are unique, no tie-breaking is needed."
    acceptance_criteria:
      - "The output contains one line per common key and no other lines."
      - "For common keys {b,a,c} the output order is a, b, c."
    priority: High
    source: "'one per line, sorted alphabetically'."

  - id: REQ-004
    title: "Print the single word none when nothing is common"
    description: "When no key is present in every object, the tool prints exactly one line containing the single lowercase word none and exits with status 0."
    acceptance_criteria:
      - "For an array whose objects share no key, the complete output is the one line 'none'."
      - "No other line, prefix or suffix is printed in that case."
    priority: High
    source: "'or the single word none when no key is common to all of them'."

  - id: REQ-005
    title: "Ship the tool's own test suite and its runner"
    description: "The deliverable ships automated tests for the behaviour above, plus a runner run-tests.sh at the repository root that runs them and writes a TAP report to reports/tests.tap. `bash run-tests.sh` exits 0 only when every delivered test passes."
    acceptance_criteria:
      - "`bash run-tests.sh` exits 0 and writes a readable TAP report at reports/tests.tap."
      - "The TAP report contains no failing test point when the delivered behaviour is correct."
    priority: Medium
    source: "Deliverable contract in this document; the SCN-001 scenario reads this report."

  - id: REQ-006
    title: "Ship the mutation harness"
    description: "The deliverable ships `bash mutation.sh`, which mutates the delivered implementation, runs the delivered tests against each mutant, and writes a survivors-json report to reports/mutation/mutation.json with total and survivors entries."
    acceptance_criteria:
      - "`bash mutation.sh` writes reports/mutation/mutation.json in the survivors-json shape with total and survivors keys."
      - "The report records at least one mutant, so the mutation check is not vacuous."
    priority: Medium
    source: "Deliverable contract in this document; the REL-001 mutation-detection relation reads this report."

  - id: REQ-007
    title: "Resolve undefined input edges as the recorded decisions say"
    description: "The behaviour for an empty array, for array elements that are not JSON objects, and for a missing, unreadable, non-JSON, or non-array input is exactly what AMB-001, AMB-002 and AMB-003 decide. No automated judge in this document checks these behaviours yet."
    acceptance_criteria:
      - "The chosen empty-array behaviour matches AMB-001."
      - "The chosen non-object-element behaviour matches AMB-002."
      - "The chosen invalid-input behaviour matches AMB-003."
    priority: Medium
    source: "The request does not state edge-case behaviour; recorded as decisions."

ambiguities:
  - id: AMB-001
    question: "What should the tool do when the top-level JSON array is empty (zero objects)?"
    options:
      - "none: print the single word none and exit 0, because no key is common to all zero objects"
      - "error: exit non-zero with a diagnostic, because an empty array is not a meaningful query"
    default: "none: print the single word none and exit 0, because no key is common to all zero objects"
    blocking: false

    chosen: "none: print the single word none and exit 0, because no key is common to all zero objects"
  - id: AMB-002
    question: "What should the tool do with array elements that are not JSON objects (numbers, strings, null, nested arrays)?"
    options:
      - "skip: ignore the non-object element and intersect the keys of the remaining objects"
      - "error: exit non-zero with a diagnostic naming the offending element"
    default: "skip: ignore the non-object element and intersect the keys of the remaining objects"
    blocking: false

    chosen: "skip: ignore the non-object element and intersect the keys of the remaining objects"
  - id: AMB-003
    question: "What should the tool do when the input file is missing, unreadable, not valid JSON, or its top level is not an array?"
    options:
      - "error: exit non-zero and print a diagnostic to stderr, producing no result lines"
      - "none: print none and exit 0, treating unusable input as an empty intersection"
    default: "error: exit non-zero and print a diagnostic to stderr, producing no result lines"
    blocking: false

    chosen: "error: exit non-zero and print a diagnostic to stderr, producing no result lines"
deliverable:
  run: "bash common-keys.sh {json}"
  timeoutMs: 30000
  scenarios:
    - id: SCN-001
      run: "bash run-tests.sh"
      expect: "the delivered test suite passes and asserts the common-key intersection, its alphabetical ordering, and the none case"
      report: tap
      report_path: "reports/tests.tap"
  relations:
    - id: REL-001
      relation: mutation-detection
      description: "The delivered tests fail when the delivered common-key behaviour is mutated, as read from the declared mutation report."
  mutation:
    run: "bash mutation.sh"
    report_path: "reports/mutation/mutation.json"
    format: survivors-json
    max_survivors: 0
    timeoutMs: 900000
