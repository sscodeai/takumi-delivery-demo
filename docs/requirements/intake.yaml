requirements:
  - id: REQ-001
    title: "Provide a CSV summarising entry point"
    description: "The deliverable is a command-line tool invoked as `bash summary.sh <csv>` from the repository root. summary.sh is the only entry point, takes the CSV path as $1, reads a CSV whose first line is the header `region,amount`, and exits 0 after printing the report to stdout. It must not require network access or a build step, and it must print nothing but report lines to stdout (diagnostics, if any, go to stderr)."
    acceptance_criteria:
      - "`bash summary.sh sample.csv` on a well-formed file exits 0 and writes report lines to stdout."
      - "The script is named summary.sh, sits at the repository root, and reads the input path from its first positional argument."
      - "The first line of the input is treated as the header row and is never counted as a data row, even when the header names differ in case or surrounding whitespace."
    priority: High
    source: "I want a command-line tool that reads a CSV of sales records; CSV has a header row with columns region, amount"

  - id: REQ-002
    title: "Print total revenue and average order value per region"
    description: "For every distinct region value in the data rows, print exactly one region line of the form `<region> <count> <sum> <mean>`, where count is the number of data rows attributed to that region, sum is the total revenue (sum of the amount column) for that region, and mean is the average order value (sum divided by count) for that region. Sum and mean are printed with exactly two decimal places; count is an integer with no decimal point."
    acceptance_criteria:
      - "A file containing `North,120.50` and `North,99.50` and `South,80.00` prints a North line whose count is 2, whose sum is 220.00 and whose mean is 110.00, and a South line whose count is 1, whose sum is 80.00 and whose mean is 80.00."
      - "Every distinct region in the data rows appears on exactly one region line and no region line names a region absent from the data rows."
      - "Each region line's field values appear positionally in the order region, count, sum, mean, separated by single spaces."
    priority: High
    source: "prints the total revenue and the average order value per region"

  - id: REQ-003
    title: "Print a whole-report totals line"
    description: "After the region lines, print exactly one totals line of the form `TOTAL <count> <sum>`, where count is the number of usable data rows across all regions and sum is the total revenue across all regions, formatted like the region-line numbers (integer count, two-decimal sum). For an input with a header row and no data rows, print only the totals line, with count 0 and sum 0.00, and exit 0."
    acceptance_criteria:
      - "Exactly one line in the output starts with `TOTAL `."
      - "For the sample world, the totals line is `TOTAL 4 345.25` and it follows all region lines."
      - "A header-only file produces the single line `TOTAL 0 0.00` and exit status 0."
    priority: High
    source: "prints the total revenue ... (the whole, not only per region)"

  - id: REQ-004
    title: "Handle unusable data rows as decided"
    description: "A data row is unusable when it does not have exactly two fields, when the region field is empty or whitespace-only, or when the amount field is not a plain decimal number (optional leading minus, digits, optional fractional part). Unusable rows are handled the way AMB-001 decides; a row that is skipped is excluded from every aggregate and from the totals line, and a file a human reads still shows how many rows were skipped when AMB-001 says to count them."
    acceptance_criteria:
      - "A file with one well-formed row and one row whose amount is `abc` still exits 0 under the default decision and prints region aggregates computed only from the well-formed row."
      - "Skipped rows never contribute to any region count, region sum, region mean, or the totals line."
      - "The number of skipped rows reported, if reported, equals the number of unusable data rows in the input."
    priority: High
    source: "CSV ... columns: region, amount (the request does not say what a broken row does)"

  - id: REQ-005
    title: "Aggregate repeated region keys into one region line"
    description: "A region value repeating across rows is not an error and not a conflict: every data row is its own order and all rows sharing a region key contribute to that region's single count, sum and mean, as AMB-002 decides. Region lines are emitted in ascending byte order of the region string so that the output is deterministic."
    acceptance_criteria:
      - "Two rows with region `North` produce one North line whose count is 2 rather than two North lines."
      - "Region lines appear in ascending byte order of the region string."
      - "No region key is dropped or merged with a differently spelled region key."
    priority: High
    source: "per region (region is a group key, so it repeats by nature)"

  - id: REQ-006
    title: "Round and format every printed number predictably"
    description: "Sums and means are printed with exactly two decimal places using round-half-away-from-zero, as AMB-003 decides, regardless of the number of decimals present in the input. No thousands separators, currency symbols or scientific notation are printed. The sum of a region is the rounded total of its raw amounts, and the mean is computed from the unrounded region sum divided by the region count and then rounded for printing."
    acceptance_criteria:
      - "An amount of `0.005`-style halves round away from zero at the second decimal place rather than being truncated."
      - "Every printed sum and mean matches the regular expression `-?[0-9]+\\.[0-9]{2}`."
      - "Input amounts written with one decimal or with none still produce two-decimal output."
    priority: Medium
    source: "average order value (a quotient, so its printed precision must be settled)"

  - id: REQ-007
    title: "Make the report independent of row order"
    description: "Shuffling the data rows of an input must not change any region line or the totals line, and must not change the order in which region lines are printed, which is fixed by the region string."
    acceptance_criteria:
      - "Running the tool on a file and on a row-shuffled copy of the same file yields byte-identical stdout."
      - "Each region's count, sum and mean is unchanged by row order, including when the mean is a repeating decimal."
    priority: Medium
    source: "reads a CSV of sales records (no ordering is stated, so the result must not depend on it)"

ambiguities:
  - id: AMB-001
    question: "What happens to a data row that cannot be used (wrong field count, empty region, non-numeric amount)?"
    options:
      - "skip-count: skip the unusable row, exclude it from all aggregates, and report the number skipped on a `SKIPPED <skipped-count>` line"
      - "skip-silent: skip the unusable row silently, with no skipped line and no stderr message"
      - "stop-error: abort the whole run with a non-zero exit status and an error message naming the offending line"
    default: "skip-count: skip the unusable row, exclude it from all aggregates, and report the number skipped on a `SKIPPED <skipped-count>` line"
    checkedAs: skip-count
    blocking: true
    chosen: "skip-count: skip the unusable row, exclude it from all aggregates, and report the number skipped on a `SKIPPED <skipped-count>` line"
  - id: AMB-002
    question: "When the same region key appears on several data rows, what does the report do with those rows?"
    options:
      - "merge: every occurrence counts as its own order, so all rows with that region form one aggregate"
      - "last-row: only the last occurrence of the region is kept and earlier rows with that region are discarded"
      - "error: a repeated region key is a hard failure with a non-zero exit status"
    default: "merge: every occurrence counts as its own order, so all rows with that region form one aggregate"
    checkedAs: merge
    blocking: true
    chosen: "merge: every occurrence counts as its own order, so all rows with that region form one aggregate"
  - id: AMB-003
    question: "How do the printed sums and averages round when the exact value has more than two decimal places?"
    options:
      - "half-up: round half away from zero at the second decimal place"
      - "truncate: drop everything after the second decimal place without rounding"
    default: "half-up: round half away from zero at the second decimal place"
    checkedAs: half-up
    blocking: true
    chosen: "half-up: round half away from zero at the second decimal place"
  - id: AMB-004
    question: "How should the amount field be parsed before it is summed?"
    options:
      - "plain-decimal: only an optional leading sign, digits and an optional fractional part are accepted; anything else (currency symbols, thousands separators, percent signs) makes the row unusable under AMB-001"
      - "tolerant: strip currency symbols, thousands separators and surrounding whitespace, then parse what remains as a decimal"
    default: "plain-decimal: only an optional leading sign, digits and an optional fractional part are accepted; anything else (currency symbols, thousands separators, percent signs) makes the row unusable under AMB-001"
    blocking: false
    chosen: "plain-decimal: only an optional leading sign, digits and an optional fractional part are accepted; anything else (currency symbols, thousands separators, percent signs) makes the row unusable under AMB-001"
  - id: AMB-005
    question: "Is the region key compared exactly as written, or normalised before grouping?"
    options:
      - "exact: the region field is used verbatim as the group key, so differing case or internal spacing yields different regions"
      - "trim-fold: surrounding whitespace is stripped and the value is lowercased before grouping, and the printed key is the lowercased trimmed form"
    default: "exact: the region field is used verbatim as the group key, so differing case or internal spacing yields different regions"
    blocking: false

    chosen: "exact: the region field is used verbatim as the group key, so differing case or internal spacing yields different regions"
deliverable:
  run: "bash summary.sh {csv}"
  timeoutMs: 30000
  input_format:
    columns: "region:id,amount:measure"
    sample: |
      North,120.50
      South,80.00
      North,99.50
      East,45.25
  output_format:
    region_line:
      shape: "<region> <count> <sum> <mean>"
      fields: [id, count, sum, mean]
    total_line:
      shape: "TOTAL <count> <sum>"
      fields: [count, sum]
    skipped_line:
      shape: "SKIPPED <skipped-count>"
      fields: [skipped-count]
  relations:
    - id: REL-001
      relation: malformed-row-accounting
      decides: AMB-001
      description: "An unusable row is skipped and the printed report accounts for it the way AMB-001 decided, with the skipped rows excluded from every aggregate and from the totals line."
    - id: REL-002
      relation: duplicate-resolution
      decides: AMB-002
      description: "Rows sharing a region key resolve into that region's aggregate the way AMB-002 decided."
    - id: REL-003
      relation: additivity
      description: "The per-region counts sum to the count on the TOTAL line, and the per-region sums sum to the sum on the TOTAL line."
    - id: REL-004
      relation: row-order-invariance
      description: "Shuffling the data rows leaves every printed line and their order unchanged."
  differential:
    - id: DIFF-001
      anchor: independent-aggregation
      decides: AMB-003
      description: "An independent recomputation of each region's count, summed revenue and average order value, rounded as AMB-003 decided, matches the tool's region lines and totals line."
